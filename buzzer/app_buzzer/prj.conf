# The wearable is a BLE peripheral that vibrates and otherwise sleeps.

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_POWEROFF=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BAS=y

# The advertised name is built at boot from the BT address (CHF-XXXX), so two
# wearables at one desk are tellable apart. The static name is a placeholder.
CONFIG_BT_DEVICE_NAME="CHF-0000"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=16

# 30-50 ms interval, latency 2, 5 s supervision: worst-case write ~90 ms against
# the 100 ms budget, average radio draw tens of uA. The peripheral asks; Chrome's
# stacks generally grant.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=2
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=500
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# Drag-and-drop flashing: the XIAO's Adafruit bootloader takes UF2.
CONFIG_BUILD_OUTPUT_UF2=y
