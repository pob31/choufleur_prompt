# USB CDC console build, as in headtracker_v1: driverless serial for log output.
# west build ... -- -DEXTRA_CONF_FILE=debug_usb.conf -DEXTRA_DTC_OVERLAY_FILE=debug_usb.overlay

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Choufleur buzzer"
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
