[workspace]
resolver = "2"
members = [
    "crates/choufleur-app",
    "crates/choufleur-core",
    "crates/choufleur-asr",
    "crates/choufleur-replay",
    "crates/choufleur-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Floor set by our dependencies, not by our own code: ort 2.0.0-rc.13 declares
# 1.88 and whisper-rs-sys 0.15 declares 1.88. Claiming anything lower would be a
# lie that only shows up as a compile failure on an older toolchain.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pobo/choufleur"

[workspace.dependencies]
choufleur-core = { path = "crates/choufleur-core" }
choufleur-asr = { path = "crates/choufleur-asr" }
choufleur-server = { path = "crates/choufleur-server" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-properties = "0.1"
rapidfuzz = "0.5"
criterion = "0.7"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
futures-util = "0.3"
cpal = "0.15"
libc = "0.2"

[profile.release]
debug = 1

# Dependencies of the ASR stack are heavy C/C++ builds; always optimize them,
# even in dev profiles, or the replay harness is unusably slow.
[profile.dev.package."*"]
opt-level = 3
