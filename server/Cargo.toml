[workspace]
resolver = "2"
members = [
    "crates/choufleur-core",
    "crates/choufleur-asr",
    "crates/choufleur-replay",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pobo/choufleur"

[workspace.dependencies]
choufleur-core = { path = "crates/choufleur-core" }
choufleur-asr = { path = "crates/choufleur-asr" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-properties = "0.1"
rapidfuzz = "0.5"
criterion = "0.7"

[profile.release]
debug = 1

# Dependencies of the ASR stack are heavy C/C++ builds; always optimize them,
# even in dev profiles, or the replay harness is unusably slow.
[profile.dev.package."*"]
opt-level = 3
