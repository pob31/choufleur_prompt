  // so during an untouched run the flag button follows the position.
  let jumpedTo = null;
  const $flag = document.getElementById('flag');
  const $flagCount = document.getElementById('flagcount');

  const flagsAt = () => lines.reduce((a, l, i) => (l.flags?.length ? (a.push(i), a) : a), []);

  // Whatever the operator is looking at: the line being spoken during a run, or the
  // one they last jumped to in prep, where nothing is running and `current` is -1.
  const subject = () => (jumpedTo !== null ? jumpedTo : current);

  function paintFlags() {
    const all = flagsAt();
    $flagCount.textContent = all.length ? String(all.length) : '—';
    const at = subject();
    $flag.classList.toggle('on', at >= 0 && flaggedByMe(lines[at] || {}));
  }

  // The cue list is the identity — "the sound flags", "the LX flags" — so no operator
  // name is needed and none is trusted. The timestamp is this device's wall clock,
  // which is what a bookmark wants.
  const myMark = () => sheetOf(targetSheet())?.name || 'unknown';
  const flaggedByMe = (l) => (l.flags || []).some((f) => f.by === myMark());

  // Who may clear what. During a run you touch only your own marks: another list's flag
  // is their unfinished business, and a show is no time to be deciding it is finished.
  // Prep is the opposite case — that is when somebody sits down with the whole script to
  // clear out what no longer applies, and being unable to remove a stale mark left by a
  // list that has since gone home is how a script silently fills up with them.
  const clearable = (f) =>
    document.body.dataset.prep === 'on' || f.by === myMark();

  function toggleFlag(index) {
    if (index < 0 || index >= lines.length || !ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({
      type: 'flag_line', lineIndex: index,
      flag: !flaggedByMe(lines[index]),
      by: myMark(), at: new Date().toISOString(),
    }));
  }

  $flag.addEventListener('click', () => toggleFlag(subject()));

  // The cast, and the microphones it is on.
  //
  // A character is declared by being in the script's `characters` array, and only a
  // declared one can be put on a channel or named in a group. Naming a speaker on a line
  // now declares them automatically, so this panel is for what comes after: the display
  // name, which microphones carry them, who a chorus is made of, and merging two
  // spellings of one person.
  //
  // That last one is why it exists. The Lazzi PDF sets `Philipe` in bold ten times
  // against `Philippe` four hundred and seventy-nine, and no rule can know they are the
  // same performer — but the person preparing the show knows at a glance.
  const $cast = document.getElementById('cast');
  const $lists = document.getElementById('lists');
  let cast = [];
  let channels = [];
  let mergeFrom = null;

  const lineCount = (id) => lines.filter((l) => l.character === id).length;

  async function loadCast() {
    try {
      const d = await (await fetch('/cast.json')).json();
      cast = d.characters || [];
      channels = d.channels || [];
    } catch { cast = []; channels = []; }
  }

  function sendCast() {
    ws?.send(JSON.stringify({ type: 'edit_cast', characters: cast }));
  }

  function paintCast() {
    $cast.textContent = '';
    const h = document.createElement('h4');
    h.textContent = cast.length ? `${cast.length} in the cast` : 'nobody declared yet';
    $cast.appendChild(h);

    if (mergeFrom) {
      const hint = document.createElement('div');
      hint.className = 'warn';
      const who = cast.find((c) => c.id === mergeFrom);
      hint.textContent = `Who is ${who?.name || mergeFrom} really? Click them, and every `
        + `line will move across.`;
      $cast.appendChild(hint);
    }

    if (!cast.length) {
      const p = document.createElement('div');
      p.className = 'memberof';
      p.textContent = 'Type a name on a line and it appears here.';
      $cast.appendChild(p);
    }

    // What there is to assign, and where it comes from. The button lives on this row
    // rather than under it, so patching a whole cast makes the button vanish and moves
    // nothing else — a list that jumps at the moment you click is a list you have to
    // find your place in again.
    const map = document.createElement('div');
    map.className = 'chanmap';
    const roster = document.createElement('span');
    roster.className = 'roster';
    if (!channels.length) {
      roster.textContent = 'No microphones patched yet — set them in the audio panel, '
        + 'then assign them here. A show on one mixed feed still wants everybody on it.';
    } else {
      roster.append(document.createTextNode('Patched: '));
      for (const c of channels) {
        const b = document.createElement('span');
        b.textContent = `${c.index} · ${c.note}`;
        roster.appendChild(b);
      }
    }
    map.appendChild(roster);

    // A show on one feed wants everybody on it, and doing that twenty-two times by hand
    // is the kind of task people abandon halfway — which leaves a cast half-patched.
    if (channels.length && cast.some((c) => !(c.channels || []).length)) {
      const go = document.createElement('button');
      const first = channels[0].index;
      const missing = cast.filter((c) => !(c.channels || []).length).length;
      go.className = 'putall';
      go.textContent = `Put ${missing === cast.length ? 'everyone' : `the other ${missing}`}`
        + ` on ${first}`;
      go.onclick = () => {
        for (const c of cast) if (!(c.channels || []).length) c.channels = [first];
        sendCast(); paintCast();
      };
      map.appendChild(go);
    }
    $cast.appendChild(map);

    // Column headings. Three of the four fields are a bare box otherwise, and the one
    // carrying microphone numbers is the least guessable of them.
    const head = document.createElement('div');
    head.className = 'member heading';
    for (const t of ['Name', 'Microphones', 'Lines', '']) {
      const c = document.createElement('span');
      c.textContent = t;
      head.appendChild(c);
    }
    $cast.appendChild(head);

    for (const c of cast) {
      const row = document.createElement('div');
      row.className = 'member' + (c.members?.length ? ' group' : '');

      const name = document.createElement('input');
      name.value = c.name || c.id;
      name.title = c.id;
      name.onchange = () => { c.name = name.value.trim() || c.id; sendCast(); };

      // Microphones, as a comma-separated list of channel numbers. A free field rather
      // than a picker because several is normal and a show may have eighteen.
      const chan = document.createElement('input');
      chan.value = (c.channels || []).join(', ');
      chan.className = (c.channels || []).length ? 'set' : '';
      // Not a range: `1–1` on a one-channel show reads as a broken field rather than
      // as a choice of one. The roster above says what there is.
      chan.placeholder = channels.length ? 'none' : '—';
      chan.title = channels.length
        ? 'which microphones carry this performer, by number — several is normal'
        : 'patch a channel in the audio panel first';
      chan.onchange = () => {
        c.channels = chan.value.split(/[,\s]+/)
          .map((n) => parseInt(n, 10)).filter((n) => Number.isFinite(n));
        chan.value = c.channels.join(', ');
        sendCast();
      };

      const count = document.createElement('span');
      count.className = 'count';
      const n = lineCount(c.id);
      count.textContent = n ? `${n} lines` : 'no lines';
      if (!n) count.style.color = 'var(--lost)';

      // Two clicks: the one who should not exist, then the one who should. A label
      // reading "merge" told nobody which way round that goes.
      // Two clicks: the one who should not exist, then the one who should. A label
      // reading "merge" told nobody which way round that goes.
      const merge = document.createElement('button');
      merge.textContent = mergeFrom === c.id ? 'cancel'
        : mergeFrom ? '← is really this' : 'same as…';
      merge.title = mergeFrom === c.id
        ? 'never mind'
        : mergeFrom
          ? `every line of ${mergeFrom} becomes ${c.name || c.id}, and ${mergeFrom} goes`
          : 'this speaker is really somebody else already in the list — '
            + 'a misspelling, or a mode like (voix off). Click, then click who they are.';
      merge.onclick = () => {
        if (!mergeFrom) { mergeFrom = c.id; paintCast(); return; }
        if (mergeFrom === c.id) { mergeFrom = null; paintCast(); return; }
        ws?.send(JSON.stringify({ type: 'merge_speaker', from: mergeFrom, to: c.id }));
        mergeFrom = null;
      };

      row.append(name, chan, count, merge);

      // Groups are not edited here. The operator's judgement: "It's just as easy to
      // type in the names rather than groups. Even in Hécube Choeur doesn't come up
      // that often." The format still carries `members`, and the matcher still honours
      // it, so a chorus set during prep keeps working — it is simply shown rather than
      // given a column of its own on every row that will never use one.
      if ((c.members || []).length) {
        const of = document.createElement('div');
        of.className = 'memberof';
        const names = c.members.map((m) => {
          const who = cast.find((x) => x.id === m);
          return who ? (who.name || m) : m;
        });
        of.textContent = `a group: ${names.join(', ')}`;
        row.appendChild(of);
      }
      $cast.appendChild(row);
    }
  }

  // The input device, and which input feeds which channel.
  //
  // Two halves that must not be confused. The cast panel says which *logical* channel
  // carries a performer; this says which *physical input* feeds that logical channel.
  // Shows travel between houses and venues do not, so the patch lives beside the
  // library rather than inside the show — otherwise taking a production to the next
  // theatre would mean editing the script, and a script edited to move a microphone is
  // a script broken by somebody who never meant to touch it.
  //
  // Inputs are free to start anywhere. A desk sends the cast on 17–24 as often as on
  // 1–8; numbering that begins at one is a convenience for whoever wrote the software,
  // not a fact about any room.
  const $audio = document.getElementById('audio');
  let inputs = [];
  let venue = { device: '', channels: [] };
  let capture = false;

  async function loadAudio() {
    try {
      const d = await (await fetch('/audio.json')).json();
      inputs = d.inputs || [];
      venue = d.venue || { device: '', channels: [] };
      capture = !!d.capture;
    } catch { inputs = []; }
  }

  const sendVenue = () => ws?.send(JSON.stringify({ type: 'set_venue', ...venue }));

  /// Who the cast has put on this logical channel.
  const onChannel = (n) =>
    cast.filter((c) => (c.channels || []).includes(n)).map((c) => c.name || c.id);

  function paintAudio() {
    $audio.textContent = '';
    const h = document.createElement('h4');
    h.textContent = 'Audio input';
    $audio.appendChild(h);

    // Said plainly rather than implied by a dead meter. The patch is set in the
    // afternoon and is worth getting right long before there is anything to route.
    if (!capture) {
      const w = document.createElement('div');
      w.className = 'warn';
      w.textContent = 'Live capture is not built yet — this patch is saved and will be '
        + 'used when it is. Nothing is being listened to.';
      $audio.appendChild(w);
    }

    const pick = document.createElement('select');
    const none = document.createElement('option');
    none.value = '';
    none.textContent = inputs.length ? 'Default input' : 'No input devices found';
    pick.appendChild(none);
    for (const i of inputs) {
      const o = document.createElement('option');
      o.value = i.name;
      o.textContent = `${i.name} — ${i.channels} ch, ${(i.sample_rate ?? i.sampleRate) / 1000} kHz`
        + (i.default ? '  (default)' : '');
      pick.appendChild(o);
    }
    pick.value = venue.device || '';
    pick.onchange = () => { venue.device = pick.value; sendVenue(); paintAudio(); };
    $audio.appendChild(pick);

    const head = document.createElement('div');
    head.className = 'patch heading';
    for (const t of ['Channel', 'Input', 'Name', 'Carries', '']) {
      const c = document.createElement('span');
      c.textContent = t;
      head.appendChild(c);
    }
    $audio.appendChild(head);

    for (const [n, row] of venue.channels.entries()) {
      const el = document.createElement('div');
      el.className = 'patch';

      // The channel number is the application's, not the operator's: it is what the
      // cast refers to, it is handed out in order, and it is never typed. Two editable
      // number fields side by side, one meaning "the app's channel" and one meaning
      // "the desk's input", is an invitation to put the desk's number in the app's box.
      //
      // Deleting a row leaves the others' numbers alone. Renumbering would be tidier
      // and would silently repoint every performer assigned below the gap — and the
      // cast lives in the show while the patch lives in the room, so a deletion here
      // must not rewrite the script.
      const logical = document.createElement('span');
      logical.className = 'fixed';
      logical.textContent = row.logical;
      logical.title = 'the channel number the cast refers to — assigned in order';

      const input = document.createElement('input');
      input.value = row.input;
      input.title = 'the input number on the device, as the desk counts them';
      input.onchange = () => {
        row.input = parseInt(input.value, 10) || 0;
        sendVenue(); paintAudio();
      };

      // A name, because "input 17" is a number and "Éric headset" is a microphone.
      const note = document.createElement('input');
      note.value = row.note || '';
      note.placeholder = 'name it';
      note.onchange = () => { row.note = note.value.trim(); sendVenue(); };

      const who = document.createElement('span');
      const names = onChannel(row.logical);
      who.className = 'who' + (names.length ? '' : ' nobody');
      who.textContent = names.length ? names.join(', ') : 'nobody yet';
      who.title = 'set in the cast panel';

      const drop = document.createElement('button');
      drop.textContent = '×';
      drop.title = 'remove this patch';
      drop.onclick = () => { venue.channels.splice(n, 1); sendVenue(); paintAudio(); };

      el.append(logical, input, note, who, drop);
      $audio.appendChild(el);
    }

    const add = document.createElement('div');
    add.className = 'newrow';
    const go = document.createElement('button');
    go.textContent = '+ Patch a channel';
    go.onclick = () => {
      // The next free channel number, handed out by the app, and the next input up —
      // a guess that is right when patching a run of mics in order and one edit away
      // when it is not.
      const used = venue.channels.map((c) => c.logical);
      let logical = 1;
      while (used.includes(logical)) logical += 1;
      const input = venue.channels.length
        ? Math.max(...venue.channels.map((c) => c.input)) + 1
        : 1;
      venue.channels.push({ logical, input, note: '' });
      sendVenue(); paintAudio();
    };
    add.appendChild(go);
    $audio.appendChild(add);
  }

  // The cue lists this show carries, and what each one drives.
  //
  // The lists are independent documents — never merged, never renumbered against one
  // another — so this is a roster rather than a hierarchy. Categories are shown but
  // edited in the targets panel, which is where the operator already sets them for the
  // list they are working in.
  function paintLists() {
    $lists.textContent = '';
    const h = document.createElement('h4');
    h.textContent = `${sheets.length} cue list${sheets.length === 1 ? '' : 's'}`;
    $lists.appendChild(h);

    for (const sh of sheets) {
      const row = document.createElement('div');
      row.className = 'cuelist';
      const name = document.createElement('input');
      name.value = sh.name;
      name.title = sh.id;
      name.onchange = () => {
        const v = name.value.trim();
        if (v && v !== sh.name) ws?.send(JSON.stringify({ type: 'rename_sheet', sheet: sh.id, name: v }));
      };
      const count = document.createElement('span');
      count.className = 'count';
      const n = cues.filter((c) => c.sheet === sh.id).length;
      count.textContent = `${n} cue${n === 1 ? '' : 's'}`;
      count.style.cssText = 'font:400 .78em/1.3 ui-sans-serif,system-ui,sans-serif;color:var(--dimmer)';
      row.append(name, count);

      const cats = document.createElement('div');
      cats.className = 'cats';
      if (!sh.categories?.length) {
        const none = document.createElement('span');
        none.className = 'none';
        none.textContent = 'no categories — set them in targets';
        cats.appendChild(none);
      }
      for (const cat of sh.categories || []) {
        const used = cues.filter((c) => c.sheet === sh.id && c.colour === cat.key).length;
        const chip = document.createElement('span');
        chip.className = 'cat';
        const dot = document.createElement('i');
        dot.style.background = cat.swatch || 'var(--dimmer)';
        chip.append(dot, document.createTextNode(`${cat.label} ${used}`));
        cats.appendChild(chip);
      }
      row.appendChild(cats);
      $lists.appendChild(row);
    }

    const add = document.createElement('div');
    add.className = 'newrow';
    const field = document.createElement('input');
    field.placeholder = 'Conduite LUMIÈRE';
    const go = document.createElement('button');
    go.textContent = 'New list';
    const make = () => {
      const v = field.value.trim();
      if (!v) return;
      ws?.send(JSON.stringify({ type: 'new_sheet', name: v }));
      field.value = '';
    };
    go.onclick = make;
    field.onkeydown = (e) => { if (e.key === 'Enter') make(); };
    add.append(field, go);
    $lists.appendChild(add);
  }

  function togglePanel(which, paint) {
    const on = document.body.dataset[which] === 'on';
    document.body.dataset.cast = 'off';
    document.body.dataset.lists = 'off';
    document.body.dataset.audio = 'off';
    if (!on) { document.body.dataset[which] = 'on'; paint(); }
    // The button that opened a panel lights up, because otherwise the way to close it
    // is a guess — three identical buttons and no clue which one is holding the panel.
    for (const [key, id] of [['cast', 'castbtn'], ['lists', 'listsbtn'], ['audio', 'audiobtn']]) {
      document.getElementById(id)
        .classList.toggle('on', document.body.dataset[key] === 'on');
    }
  }
  document.getElementById('castbtn').addEventListener('click', async () => {
    if (!cast.length) await loadCast();
    mergeFrom = null;
    togglePanel('cast', paintCast);
  });
  document.getElementById('listsbtn').addEventListener('click', () => togglePanel('lists', paintLists));
  document.getElementById('audiobtn').addEventListener('click', async () => {
    // The cast is needed to say who each channel carries, and the devices are
    // re-enumerated every time: an interface unplugged since the afternoon is exactly
    // what this panel is for noticing.
    if (!cast.length) await loadCast();
    await loadAudio();
    togglePanel('audio', paintAudio);
  });

  // The flag list.
  //
  // Flags exist to be cleared. A mark nobody can review is a mark that rots, and a
  // script carrying last month's forgotten flags is worse than one carrying none —
  // the operator stops believing them, which costs the ones that matter. So every
  // flag is listed with who left it and when, jumps to its line on click, and can be
  // cleared from here without hunting for it.
  //
  // Who and when are the point: they are what lets somebody decide whether a mark is
  // still live. "Conduite SON, three weeks ago" answers itself.
  const $flagList = document.getElementById('flaglist');
  let flagListOpen = false;

  function paintFlagList() {
    $flagList.textContent = '';
    const all = flagsAt();
    const h = document.createElement('h4');
    h.textContent = all.length ? `${all.length} flagged` : 'nothing flagged';
    $flagList.appendChild(h);
    for (const i of all) {
      const l = lines[i];
      const row = document.createElement('div');
      row.className = 'flagrow';
      const what = document.createElement('span');
      what.className = 'what';
      what.textContent = `${l.id}  ${l.text.slice(0, 46)}`;

      // One chip per mark, each carrying who left it and when. Clearing is per-mark
      // rather than per-line, because a line two lists have flagged holds two separate
      // pieces of unfinished business and one of them may be done.
      const who = document.createElement('span');
      who.className = 'who';
      for (const f of l.flags || []) {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = `${f.by}${f.at ? ' · ' + f.at.slice(0, 16).replace('T', ' ') : ''}`;
        if (clearable(f)) {
          const x = document.createElement('button');
          x.className = 'x';
          x.textContent = '×';
          x.title = f.by === myMark() ? 'clear your mark' : `clear ${f.by}'s mark`;
          x.onclick = (e) => {
            e.stopPropagation();
            ws.send(JSON.stringify({
              type: 'flag_line', lineIndex: i, flag: false, by: f.by, at: '',
            }));
          };
          chip.appendChild(x);
        } else {
          chip.classList.add('locked');
          chip.title = 'another list\u2019s mark — clear it in prep';
        }
        who.appendChild(chip);
      }

      const go = document.createElement('button');
      go.className = 'go';
      go.textContent = 'go';
      go.onclick = (e) => { e.stopPropagation(); jumpedTo = i; goTo(i, true); };
      row.append(what, who, go);
      $flagList.appendChild(row);
    }
  }

  $flagCount.addEventListener('click', () => {
    flagListOpen = !flagListOpen;
    document.body.dataset.flaglist = flagListOpen ? 'on' : 'off';
    if (flagListOpen) paintFlagList();
  });
  // Step to the flag before or after where the *reader* is, not where the show is:
  // walking a list of things to fix is a different activity from following a run,
  // and during a run the position moves under you while you work.
  function stepFlag(dir) {
    const all = flagsAt();
    if (!all.length) return;
    const from = jumpedTo ?? current;
    const next = dir > 0
      ? all.find((i) => i > from) ?? all[0]
      : [...all].reverse().find((i) => i < from) ?? all[all.length - 1];
    jumpedTo = next;
    goTo(next, true);
  }
  document.getElementById('flagnext').addEventListener('click', () => stepFlag(1));
  document.getElementById('flagprev').addEventListener('click', () => stepFlag(-1));

  let openEditor = null;
  // The open editor's own flag button, so a flag toggled from anywhere is reflected
  // in it rather than going stale under the operator's hand.
  let repaintOpenFlag = null;
  // Set when this client asked for the insert, so it — and only it — opens the editor
  // on the new line. Every other screen just redraws.
  let pendingInsert = null;
  /// Where in the line the operator actually clicked.
  ///
  /// A speech runs to several visual lines, and dropping the caret at the end means
  /// scrolling back to the word you were looking at — the correction you came to make
  /// is almost never at the end.
  function caretAt(el, ev) {
    if (!ev) return null;
    let node = null, offset = 0;
    if (document.caretRangeFromPoint) {
      const r = document.caretRangeFromPoint(ev.clientX, ev.clientY);
      if (r) { node = r.startContainer; offset = r.startOffset; }
    } else if (document.caretPositionFromPoint) {
      const c = document.caretPositionFromPoint(ev.clientX, ev.clientY);
      if (c) { node = c.offsetNode; offset = c.offset; }
    }
    if (!node || node.nodeType !== 3 || !el.contains(node)) return null;
    // The line element holds a speaker chip and then the text, so the offset has to
    // be counted from the start of the text the editor will actually contain.
    let seen = 0;
    for (const child of el.childNodes) {
      if (child === node) return seen + offset;
      if (child.nodeType === 3) seen += child.textContent.length;
    }
    return null;
  }

  function beginEdit(el, ev) {
    if (openEditor) openEditor(false);
    const caret = caretAt(el, ev);
    const i = Number(el.dataset.i);
    const wasWho = lines[i].character || '';
    const wasText = lines[i].text;

    // Opening the editor changes every offset below it too.
    lineTops = null;
    const box = document.createElement('div');
    box.className = 'editor';
    const who = document.createElement('input');
    who.className = 'who-field';
    who.value = wasWho.replace(/^char-/, '').replace(/-/g, ' ');
    // A textarea, not an input: script lines wrap over several visual lines and an
    // input shows one, so a long speech became a slot you had to scroll sideways
    // through to read what you were correcting.
    const txt = document.createElement('textarea');
    txt.rows = 1;
    txt.value = wasText;
    const fit = () => {
      txt.style.height = 'auto';
      txt.style.height = txt.scrollHeight + 'px';
    };
    txt.addEventListener('input', fit);
    // Cut, not delete. The line stays in the script and stays on the page, struck
    // through, because a cut is a decision about tonight and not about the play — and
    // one that gets reversed often enough that losing the text would be worse than
    // showing text nobody says.
    let cut = !!lines[i].cut;
    const strike = document.createElement('button');
    const paint = () => {
      strike.textContent = cut ? 'cut — click to restore' : 'cut this line';
      strike.classList.toggle('struck', cut);
      txt.classList.toggle('gone', cut);
    };
    strike.onclick = (e) => { e.preventDefault(); cut = !cut; paint(); txt.focus(); };
    paint();
    const row = document.createElement('div');
    row.className = 'row';
    row.appendChild(strike);

    // What the line *is*, whether anyone says it, and whether tracking should wait
    // here. Three separate questions that a single "stage direction" checkbox would
    // conflate — and this show is the proof that they come apart: it stages a play
    // within a play, so Euripides' didascalies are read aloud by Séphora while
    // Rodrigues' own are never voiced.
    let kind = lines[i].kind === 'stage' ? 'stage' : 'dialogue';
    let spoken = lines[i].spoken !== false;
    let hold = lines[i].hold || null;

    const mk = (text, isOn, click) => {
      const b = document.createElement('button');
      b.textContent = text;
      b.classList.toggle('on', isOn());
      b.onclick = (e) => { e.preventDefault(); click(); repaint(); txt.focus(); };
      return b;
    };
    const sep = () => { const d = document.createElement('div'); d.className = 'sep'; return d; };
    const label = (t) => { const d = document.createElement('span'); d.className = 'label'; d.textContent = t; return d; };

    // The kind toggle does *not* touch `spoken`, though an earlier version did on the
    // reasoning that a line becoming a direction stops being voiced. That reasoning is
    // fine for a new line and wrong for an existing one: toggling the button twice —
    // to check what it did — silently cleared the voicing, and eight directions marked
    // as read aloud came back unvoiced with nothing on screen to say so. Defaults
    // belong at creation, never on an edit.
    const bStage = mk('stage direction', () => kind === 'stage', () => {
      kind = kind === 'stage' ? 'dialogue' : 'stage';
    });
    const bSpoken = mk('read aloud', () => spoken, () => { spoken = !spoken; });
    const holdBtns = [['—', null], ['silence', 'silence'], ['music', 'music'], ['ad lib', 'adlib']]
      .map(([text, value]) => mk(text, () => hold === value, () => { hold = value; }));

    const repaint = () => {
      bStage.classList.toggle('on', kind === 'stage');
      bSpoken.classList.toggle('on', spoken);
      holdBtns.forEach((b, k) => b.classList.toggle('on', hold === [null, 'silence', 'music', 'adlib'][k]));
      who.style.opacity = kind === 'stage' ? '.4' : '1';
    };
    row.append(sep(), bStage, bSpoken, sep(), label('hold'), ...holdBtns);
    repaint();
    // Delete, not cut, and the two must not look alike. A cut is a decision about
    // tonight and the text stays on the page struck through; a delete says the line
    // was never in the play — the importer reading the next actor's name as something
    // the previous one says. Filing a typo as a decision leaves the operator reading
    // around rubbish for the run of the show.
    //
    // Two clicks, because it cannot be undone from here. Not a modal: a dialogue box
    // in the middle of table work is answered without being read.
    // Also in the editor, because once you have opened a line to fix it you may
    // decide it needs someone else's eye instead. Sent immediately rather than on
    // commit: a flag is not part of the text edit and should survive cancelling it.
    const bFlag = document.createElement('button');
    bFlag.textContent = 'flag';
    bFlag.onmousedown = (e) => e.preventDefault();
    const paintFlagBtn = () => bFlag.classList.toggle('flagged', flaggedByMe(lines[i]));
    bFlag.onclick = (e) => {
      e.preventDefault();
      toggleFlag(i);
      txt.focus();
    };
    paintFlagBtn();
    repaintOpenFlag = paintFlagBtn;
    row.append(sep(), bFlag);

    const bAddCue = document.createElement('button');
    bAddCue.className = 'insert';
    bAddCue.textContent = 'add cue';
    bAddCue.onmousedown = (e) => e.preventDefault();
    bAddCue.onclick = (e) => {
      e.preventDefault();
      pendingCueFor = lines[i].id;
      ws.send(JSON.stringify({
        type: 'insert_cue', sheet: targetSheet(), lineId: lines[i].id,
      }));
      done(true);
    };
    row.appendChild(bAddCue);

    const bDelete = document.createElement('button');
    bDelete.className = 'danger';
    let armed = false;
    // Set when this editor is being torn down on purpose, so the focus handlers do
    // not treat the teardown as the operator clicking away.
    let closing = false;
    bDelete.textContent = 'delete';
    bDelete.onmousedown = (e) => e.preventDefault();
    bDelete.onclick = (e) => {
      e.preventDefault();
      if (!armed) {
        armed = true;
        bDelete.textContent = 'delete for good?';
        bDelete.classList.add('armed');
        setTimeout(() => {
          if (!armed) return;
          armed = false;
          bDelete.textContent = 'delete';
          bDelete.classList.remove('armed');
        }, 4000);
        // Put the caret back, or the editor closes underneath the armed button.
        //
        // WebKit does not focus a <button> when it is clicked, so the click blurs the
        // textarea, `focusout` fires with a null relatedTarget, and the editor commits
        // and closes — taking the half-armed button with it. The next click lands on a
        // freshly rebuilt, disarmed button, so the second step can never be reached and
        // delete looks simply broken. Every other control in this row already ends in
        // `txt.focus()`, which is exactly why they work and this did not.
        txt.focus();
        return;
      }
      // Closing deliberately: suppress the commit that dismantling the box would
      // otherwise trigger. Saving a line on its way out is harmless here but writes a
      // spurious edit to disk and to every other screen.
      closing = true;
      openEditor = null;
      box.replaceWith(el);
      ws.send(JSON.stringify({ type: 'delete_line', lineIndex: i }));
    };
    row.appendChild(bDelete);

    const bInsert = document.createElement('button');
    bInsert.className = 'insert';
    bInsert.textContent = 'insert line below';
    bInsert.onmousedown = (e) => e.preventDefault();
    bInsert.onclick = (e) => {
      e.preventDefault();
      // Save this line first: the insert renumbers everything below it, so an edit
      // still sitting in the box would be written back against the wrong index.
      done(true);
      pendingInsert = i + 1;
      ws.send(JSON.stringify({ type: 'insert_line', lineIndex: i, text: '', kind: 'dialogue' }));
    };
    row.appendChild(bInsert);

    const keys = document.createElement('div');
    keys.className = 'keys';
    keys.textContent = 'enter to save · esc to cancel · tab between fields';
    box.append(who, txt, row, keys);
    el.replaceWith(box);

    const done = (commit) => {
      if (closing) return;
      closing = true;
      openEditor = null;
      repaintOpenFlag = null;
      const newText = txt.value.trim();
      const newWho = who.value.trim();
      if (commit && newText) {
        const character = newWho
          ? 'char-' + newWho.toLowerCase().replace(/\s+/g, '-')
          : wasWho;
        const changed = newText !== wasText
          || character !== wasWho
          || cut !== !!lines[i].cut
          || kind !== (lines[i].kind === 'stage' ? 'stage' : 'dialogue')
          || spoken !== (lines[i].spoken !== false)
          || (hold || null) !== (lines[i].hold || null);
        if (changed) {
          ws.send(JSON.stringify({
            type: 'edit_line', lineIndex: i, text: newText, character, cut,
            kind, spoken, hold,
          }));
          lines[i].text = newText;
          lines[i].character = character;
          lines[i].cut = cut;
          lines[i].kind = kind;
          lines[i].spoken = spoken;
          lines[i].hold = hold;
        }
      }
      box.replaceWith(el);
      render(i);
      // The editor was taller than the line it replaced, so every offset below it
      // moved; the marks have to be put back where they now belong.
      lineTops = null;
      replace();
    };
    openEditor = done;
    txt.onkeydown = who.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); done(true); }
      if (e.key === 'Escape') { e.preventDefault(); done(false); }
    };
    // Committing on blur would fire when tabbing between the two fields, so the
    // editor closes only on an explicit key or a click elsewhere.
    box.addEventListener('focusout', (e) => {
      if (closing) return;
      if (!box.contains(e.relatedTarget)) done(true);
    });
    fit();
    txt.focus();
    const at = caret === null ? txt.value.length : Math.min(caret, txt.value.length);
    txt.setSelectionRange(at, at);
  }

  const HOLD_LABEL = { music: 'music', silence: 'silence', adlib: 'ad lib' };

  // lineIndex -> every phrase in that line which fires a cue, each tagged with the id
  // of the cue it belongs to. Consulted by decorate(), so a line rebuilt for any
  // reason keeps its marks.
  //
  // A list rather than one entry per line. The first version kept a single trigger,
  // on the reasoning that two cues on one line would fight over the text — but a long
  // speech legitimately carries several cues at different points, and collapsing them
  // meant every cue after the first pointed at the end of the block instead of at the
  // words that fire it. Overlaps are dropped rather than nested, since a phrase inside
  // another phrase cannot be marked twice.
  let triggerOf = new Map();

  function decorate(el, l) {
    const stage = l.kind === 'stage';
    // Carried over rather than rebuilt: `now` and `past` say where the *show* is,
    // which has nothing to do with what the line says. Writing className wholesale
    // dropped them, so correcting the line being spoken made its highlight disappear.
    const state = ['now', 'past', 'placed'].filter((c) => el.classList.contains(c));
    el.className = 'line'
      + (l.cut ? ' cut' : '')
      + (stage ? ' stage' : '')
      + (stage && l.spoken ? ' voiced' : '')
      + (l.hold ? ' holding' : '')
      + (l.flags?.length ? ' flagged' : '');
    // Who and when, on hover — a shared mark is worth being able to ask about.
    if (l.flags?.length) {
      el.title = l.flags.map((f) => `${f.by}${f.at ? ' · ' + f.at.slice(0, 16).replace('T', ' ') : ''}`).join('\n');
    } else {
      el.removeAttribute('title');
    }
    el.textContent = '';
    if (l.hold) {
      el.dataset.hold = l.hold;
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = HOLD_LABEL[l.hold] || l.hold;
      el.appendChild(tag);
    } else {
      delete el.dataset.hold;
    }
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = (l.character || '').replace(/^char-/, '').replace(/-/g, ' ');
    el.appendChild(who);
    // Split around the phrase the cue fires on, so a leader line has something exact
    // to point at. Falls back to plain text whenever the phrase is not found — the
    // script is edited from this page, and a trigger extracted this morning may
    // simply no longer be in the line.
    const specs = (triggerOf.get(Number(el.dataset.i)) || [])
      .map((t) => {
        // The nth occurrence, not the first.
        let at = l.text.indexOf(t.text);
        for (let n = 0; n < (t.nth || 0) && at >= 0; n++) at = l.text.indexOf(t.text, at + 1);
        return { id: t.id, colour: t.colour, sheet: t.sheet, at, len: t.text.length };
      })
      .filter((x) => x.at >= 0)
      .sort((a, b) => a.at - b.at);
    let cursor = 0;
    for (const x of specs) {
      if (x.at < cursor) continue;                 // overlaps the one before it
      el.appendChild(document.createTextNode(l.text.slice(cursor, x.at)));
      const m = document.createElement('mark');
      m.className = 'trig';
      m.dataset.cue = x.id;
      if (x.sheet) m.dataset.sheet = x.sheet;
      if (x.colour) m.dataset.colour = x.colour;
      m.textContent = l.text.slice(x.at, x.at + x.len);
      el.appendChild(m);
      cursor = x.at + x.len;
    }
    el.appendChild(document.createTextNode(l.text.slice(cursor)));
    el.classList.add(...state);
  }

  function render(i) {
    const el = els[i];
    if (el) decorate(el, lines[i]);
  }

  // Double-click a line to give it a cue.
  //
  // Adding one used to mean opening the line editor and finding a button, or opening
  // somebody else's cue and using "add cue here" — which is fine when a line already
  // has a cue and absurd when it does not. Pointing at the line is the gesture.
  //
  // A double-click is preceded by two ordinary clicks, so the line editor has already
  // opened by the time this fires. It is cancelled rather than committed: the operator
  // asked for a cue, not for an edit, and committing here would write back whatever the
  // editor happened to be showing.
  $lines.addEventListener('dblclick', (ev) => {
    if (document.body.dataset.prep !== 'on') return;
    // A plain double-click and nothing else.
    //
    // Alt-click toggles a flag, and flagging a run of lines means alt-clicking several
    // times in a row — which the browser also reports as a double-click, so every
    // second flag was quietly making a cue as well. Any modifier held means the
    // operator is doing the other thing.
    if (ev.altKey || ev.metaKey || ev.ctrlKey || ev.shiftKey) return;
    const el = ev.target.closest('.line');
    if (!el || !ws || ws.readyState !== 1) return;
    ev.preventDefault();
    if (openEditor) openEditor(false);
    // Selecting a word to make it the trigger also produces a double-click, so the
    // selection is cleared — otherwise the new cue's editor opens with the operator's
    // accidental double-click already looking like a chosen trigger phrase.
    window.getSelection()?.removeAllRanges();
    const i = Number(el.dataset.i);
    pendingCueFor = lines[i].id;
    ws.send(JSON.stringify({
      type: 'insert_cue', sheet: targetSheet(), lineId: lines[i].id,
    }));
  });

  $lines.addEventListener('click', (ev) => {
    const el = ev.target.closest('.line');
    if (!el || !ws || ws.readyState !== 1) return;
    // While a cue is open, the script is something to point at, not something to
    // edit. Every click here otherwise opened the line editor — which replaces the
    // line with a textarea and destroys the very selection the operator was making,
    // so "use selection" could not work at all in prep, where editing is always on.
    if (cueEditing >= 0) return;
    // Alt-click flags, in either mode and without opening anything. Checked before
    // the edit branch so it works while editing is on, which is when you are most
    // likely to be triaging rather than typing.
    if (ev.altKey) { ev.preventDefault(); jumpedTo = Number(el.dataset.i); toggleFlag(jumpedTo); return; }
    // The margin mark itself: a tap reports who and when, rather than editing. Hover
    // does it on a laptop and does nothing at all on the tablet in the wings.
    if (ev.offsetX < 0 && lines[Number(el.dataset.i)]?.flags?.length) {
      ev.preventDefault();
      jumpedTo = Number(el.dataset.i);
      flagListOpen = true;
      document.body.dataset.flaglist = 'on';
      paintFlagList();
      return;
    }
    if (editing) { beginEdit(el, ev); return; }
    const i = Number(el.dataset.i);
    ws.send(JSON.stringify({ type: 'position_jump', lineIndex: i }));
    el.classList.remove('placed');
    void el.offsetWidth;
    el.classList.add('placed');
    following = true;
    $follow.hidden = true;
  });

  // A short rolling window of what the recogniser produced. Long enough to see a
  // pattern, short enough not to become something to read instead of the script.
  const $heard = document.getElementById('heardlog');
  const heardBox = document.getElementById('heard');
  const heardLog = [];
  // Follow the tail by default, and keep following unless the reader deliberately
  // scrolls back. Measuring the distance at append time instead was wrong in the way
  // that matters: once the backlog grew past the threshold once, the panel stopped
  // following and never resumed, so a run left alone quietly froze near the top.
  //
  // The flag is recomputed on every scroll, including the programmatic one, so
  // scrolling back to the bottom re-arms it without a separate control.
  let heardStuck = true;
  heardBox.addEventListener('scroll', () => {
    heardStuck =
      heardBox.scrollHeight - heardBox.scrollTop - heardBox.clientHeight < 24;
  }, { passive: true });
  function heard(m) {
    if (m.interim) return;               // partials churn; show settled text only
    heardLog.push(m);
    // A longer tail now that it has its own space and can be scrolled and copied.
    while (heardLog.length > 60) heardLog.shift();
    $heard.innerHTML = '';
    heardLog.forEach((h, i) => {
      const p = document.createElement('p');
      p.className =
        (h.filtered ? 'junk ' : h.matched ? 'hit ' : '') +
        (i === heardLog.length - 1 ? 'tail' : '');
      const t = Math.round(h.tAudio);
      const clock = Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
      const mark = h.filtered ? '  \u2717  ' : h.matched ? '  \u2713  ' : '  \u00b7  ';
      p.textContent = clock + mark + h.text;
      if (h.filtered) p.title = 'discarded by the hallucination filter: ' + h.filtered;
      $heard.appendChild(p);
    });
    if (heardStuck) heardBox.scrollTop = heardBox.scrollHeight;
  }
  document.getElementById('copy').addEventListener('click', async (e) => {
    e.stopPropagation();
    const text = heardLog
      .map((h) => {
        const t = Math.round(h.tAudio);
        const state = h.filtered ? h.filtered : h.matched ? 'matched' : '';
        return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0') +
          '\t' + state + '\t' + h.text;
      })
      .join('\n');
    try {
      await navigator.clipboard.writeText(text);
      const b = e.target; const was = b.textContent;
      b.textContent = 'copied'; setTimeout(() => { b.textContent = was; }, 1200);
    } catch { /* selection still works; the button is the convenience */ }
  });
  document.getElementById('ear').addEventListener('click', () => {
    document.body.dataset.heard = document.body.dataset.heard === 'off' ? 'on' : 'off';
  });

  // ---- the race: two matchers, one script, a pointer each --------------------
  const $gap = document.getElementById('gap');
  // Where the current line sits in the window, as a fraction from the top.
  //
  // Not the middle. The operator needs what is *coming* — a cue two lines away is
  // worth more than a line already spoken, and centring spends half the screen on
  // text whose only job is to confirm you were right. A third down leaves roughly
  // twice as much road ahead as behind, which is how a GPS frames it too.
  const READING_LINE = 0.34;
  // The line the viewport is currently placed for, which is not the same as the line
  // the tracker is on: the drift moves the window without changing this.
  let scrolledTo = -1;
  let raceOn = false, posA = -1, posB = -1;
  const ptr = {};

  function makePointer(id, label) {
    const d = document.createElement('div');
    d.className = 'ptr';
    d.id = id;
    d.textContent = label;
    $lines.appendChild(d);
    return d;
  }

  function movePointer(which, index) {
    const el = els[index];
    if (!el || !ptr[which]) return;
    ptr[which].style.top = (el.offsetTop + el.offsetHeight / 2 - 11) + 'px';
  }

  function race(lane, index) {
    if (!raceOn) {
      raceOn = true;
      document.body.dataset.race = 'on';
      ptr.a = makePointer('ptrA', 'A');
      ptr.b = makePointer('ptrB', 'B');
    }
    if (lane === 'a') posA = index; else posB = index;
    movePointer(lane, index);
    if (posA >= 0 && posB >= 0) {
      // Signed, from A's point of view, because A is the matcher steering
      // recognition and therefore the one on trial.
      const d = posA - posB;
      $gap.textContent =
        d === 0 ? 'level' : d > 0 ? 'B ' + d + ' behind' : 'B ' + (-d) + ' ahead';
      // Whichever is further back dims, so a glance says who is trailing without
      // reading the number.
      ptr.a.classList.toggle('stale', d < 0);
      ptr.b.classList.toggle('stale', d > 0);
    }
  }

  // Editing or cutting a line changes every offset below it, so the marks are
  // re-placed rather than left where the old layout put them.
  const replace = () => {
    if (raceOn) { movePointer('a', posA); movePointer('b', posB); }
  };
  window.addEventListener('resize', () => { lineTops = null; replace(); });

  // What this page was written against. See PROTOCOL_VERSION in live.rs.
  const PROTOCOL = 8;
  // Whether this is a reconnection rather than the first join.
  let joined = false;

  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.type === 'hello') {
        // A page newer than its server renders every new control and then quietly
        // does nothing when they are used. Say so.
        document.body.dataset.stale = m.protocol === PROTOCOL ? 'off' : 'on';
        if (m.protocol !== PROTOCOL) {
          console.warn(`page speaks protocol ${PROTOCOL}, server speaks ${m.protocol}`);
        }
        if (m.title) document.title = m.title + (m.prep ? ' — prep' : ' — live');
        if (m.prep) { document.body.dataset.prep = 'on'; setEditing(true); }
        if (m.sheets) { sheets = m.sheets; paintCategoryRules(); paintPicker(); }
        // Re-read the script on every *re*-connect, never only at startup.
        //
        // The page keeps its own copy of every line and writes the whole line back
        // when one is edited. A tab that was open across a server restart therefore
        // holds a script that may have moved on underneath it, and the next edit
        // anywhere near a changed line silently restores the old text. That is not
        // hypothetical: it is how a line corrected on disk came back wrong, and the
        // damage is invisible because the page looks exactly as it did before.
        if (joined) loadScript().then(replace);
        joined = true;
        if (m.position) { show(m.position.lineIndex, m.position.confidence); $clock.textContent = fmt(m.position.tAudio); }
      } else if (m.type === 'position_update') {
        if (m.lane === 'b') {
          race('b', m.lineIndex);
        } else {
          show(m.lineIndex, m.confidence);
          $clock.textContent = fmt(m.tAudio);
          race('a', m.lineIndex);
        }
      } else if (m.type === 'line_edited') {
        lines[m.lineIndex].text = m.text;
        if (m.character) lines[m.lineIndex].character = m.character;
        lines[m.lineIndex].cut = m.cut;
        lines[m.lineIndex].kind = m.kind;
        lines[m.lineIndex].spoken = m.spoken;
        lines[m.lineIndex].hold = m.hold ?? null;
        render(m.lineIndex);
        replace();
      } else if (m.type === 'cues_changed') {
        // A delta for one list: drop that sheet's cues and splice the new set in.
        // The server sends only the sheet that changed, because a full board is a
        // dozen lists and re-sending all of them on every edit is bytes nobody reads.
        cues = cues.filter((c) => c.sheet !== m.sheet).concat(m.cues);
        cues.sort((a, b) => a.lineIndex - b.lineIndex);
        if (m.list) {
          // Replace that sheet's meta in the roster, leaving every other list alone —
          // an edit to the lighting list is not news to the sound operator.
          const at = sheets.findIndex((sh) => sh.id === m.list.id);
          if (at >= 0) sheets[at] = m.list; else sheets.push(m.list);
          paintCategoryRules();
          paintPicker();
        }
        renderRail();
        // A cue added from a line opens straight away: an empty card in the rail is
        // not a cue, it is a promise to type one, and it should not be possible to
        // walk away having made it by accident.
        if (pendingCueFor) {
          const k = shown.findIndex((c) => c.lineId === pendingCueFor && !c.cue);
          pendingCueFor = null;
          if (k >= 0) requestAnimationFrame(() => { goTo(shown[k].lineIndex, true); editCue(k); });
        }
      } else if (m.type === 'venue_changed') {
        venue = m.venue || venue;
        // The cast panel lists the patched channels too, and used to go stale the
        // moment one was deleted — it was reading a roster fetched when it opened.
        loadCast().then(() => {
          if (document.body.dataset.audio === 'on') paintAudio();
          if (document.body.dataset.cast === 'on') paintCast();
        });
      } else if (m.type === 'cast_changed') {
        cast = m.cast || [];
        if (document.body.dataset.cast === 'on') paintCast();
        // A merge rewrote hundreds of lines, so the script is re-read rather than the
        // server sending one edit per line.
        if (m.reload) loadScript().then(() => { build(); replace(); });
      } else if (m.type === 'line_flagged') {
        lines[m.lineIndex].flags = m.flags;
        // An open editor has replaced the line element, so re-rendering it would
        // write into a node that is out of the document. The margin mark reappears
        // when the editor closes and `render` runs there.
        if (els[m.lineIndex]?.isConnected) render(m.lineIndex);
        if (repaintOpenFlag) repaintOpenFlag();
        paintFlags();
        if (flagListOpen) paintFlagList();
        lineTops = null;
      } else if (m.type === 'line_deleted') {
        lines.splice(m.lineIndex, 1);
        build();
        replace();
      } else if (m.type === 'line_inserted') {
        lines.splice(m.lineIndex, 0, m.line);
        build();
        replace();
        if (pendingInsert === m.lineIndex) {
          pendingInsert = null;
          goTo(m.lineIndex, true);
          beginEdit(els[m.lineIndex], null);
        }
      } else if (m.type === 'heard') {
        heard(m);
      } else if (m.type === 'run_state') {
        document.body.dataset.running = String(m.running);
        $clock.textContent = fmt(m.tAudio);
      }
    };
    // The run outlives any one connection; reconnecting resyncs through `hello`.
    ws.onclose = () => setTimeout(connect, 1000);
  }

  loadScript().then(loadCues).then(connect);
})();
</script>
</body>
</html>
