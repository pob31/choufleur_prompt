<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choufleur — live</title>
<link rel="stylesheet" href="/app.css">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 400 clamp(15px, 2.1vh, 22px)/1.55 ui-serif, Georgia, "Iowan Old Style", serif;
    overflow: hidden;
  }

  /* The window the eye lives in. The centre band is where the current line sits —
     the operator's own rule: the last spoken line in the middle of what is visible. */
  /* A column, so the transcript takes its own space instead of lying on top of the
     script. Overlapping cost twice: the words underneath were unreadable, and a panel
     with pointer-events disabled cannot be selected, so nothing in it could be
     copied out. */
  #stage { display: flex; flex-direction: column; height: 100%; position: relative; }
  /* `overflow: hidden` and a stacking context, both load-bearing. #scroller is
     absolutely positioned, so it paints in the positioned layer and drew straight over
     the transcript below it however the boxes were sized — document order does not
     decide painting when one sibling is positioned and the other is not. Clipping the
     box and giving the panels a higher z-index settles it from both directions. */
  /* Two matchers, one script, a pointer each — the operator's suggestion and a much
     better instrument than two columns. Side by side you compare two scrolls by eye
     and the gap is guesswork; on one text the disagreement is the distance between
     two marks, which is the only quantity anyone cares about. */
  .lane { display: none; }
  #lines { position: relative; }
  /* Inside the text column, not to the left of it. At a negative offset the marks
     sat outside the scroll origin, where `overflow-x: hidden` clips absolutely —
     drawn correctly, every frame, somewhere nobody can see. The script indents to
     make room instead, and only while a race is on. */
  body[data-race="on"] #lines { padding-left: 3.4em; }
  /* Each mark gets its own column. Stacked at the same offset they occupied exactly
     the same pixels whenever the two matchers agreed — which is most of the time —
     so the one appended second simply hid the other, and the race looked like it had
     one runner. */
  .ptr {
    position: absolute; width: 1.25em; height: 1.5em;
    display: flex; align-items: center; justify-content: center;
    border-radius: 3px; font: 700 .6em/1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .06em; transition: top .28s ease; pointer-events: none;
  }
  .ptr::after {
    content: ''; position: absolute; right: -.55em;
    border: .35em solid transparent; border-left-color: currentColor;
  }
  #ptrA { left: 0; background: var(--now); color: #1a0d0b; }
  #ptrA::after { color: var(--now); }
  #ptrB { left: 1.45em; background: var(--speaker); color: #08131c; }
  #ptrB::after { color: var(--speaker); }
  .ptr.stale { opacity: .35; }
  body:not([data-race="on"]) .ptr { display: none; }
  #gap { color: var(--speaker); }
  body:not([data-race="on"]) #gap { display: none; }
  .lane .scroll {
    position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none;
    padding: 50vh 3vw;
  }
  .lane .scroll::-webkit-scrollbar { display: none; }
  body[data-race="on"] #scroller { padding-left: 3vw; padding-right: 3vw; }
  body[data-race="on"] #view > .tag {
    position: absolute; z-index: 2; top: .4em; left: 25%; transform: translateX(-50%);
    padding: .2em .8em; border-radius: 999px; background: var(--edge); color: var(--dim);
    font: 600 .6em/1.4 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .09em; text-transform: uppercase; white-space: nowrap;
  }
  .lane .tag {
    position: absolute; z-index: 2; top: .4em; left: 50%; transform: translateX(-50%);
    padding: .2em .8em; border-radius: 999px; background: var(--edge); color: var(--dim);
    font: 600 .6em/1.4 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .09em; text-transform: uppercase; white-space: nowrap;
  }
  .lane.ahead .tag { background: var(--now); color: #1a0d0b; }
  #view { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; z-index: 0; }

  /* There is deliberately no reading band. A tinted strip across the reading line
     seemed like it would help the eye find the position and did not: the current line
     is already the only bright thing on a dim page, so the strip added glare without
     adding information. Removed on the operator's word after watching it in a booth. */
  /* The cue rail. A column of its own on the right, never overlapping the text: an
     operator reading a cue and an operator reading the line it fires on are doing two
     different things at once, and a cue laid over the script makes both harder. */
  /* The leader lines. Drawn under the cards and over the text, so a line reaches the
     word without the word being obscured by it. */
  #leads {
    position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: visible;
    /* Explicit, and not redundant with `inset: 0`.
       An <svg> is a replaced element, so `width: auto` resolves to its *intrinsic*
       size — 300 x 150 px — rather than stretching between the offsets the way a div
       does. The canvas therefore sat in the top-left corner at postcard size, and
       tendrils were drawn correctly and clipped away everywhere below it. Reported
       exactly as "only visible when the cues are in the top part of the screen",
       which is the shape of a 150-pixel-tall box. */
    width: 100%; height: 100%;
  }
  #leads path { fill: none; stroke: var(--dimmer); stroke-width: 1; }
  /* Quiet under the text. The line has to be followable without competing with the
     words it passes beneath — an operator reads the script far more often than they
     trace a tendril. */
  #leads path { stroke-opacity: .62; }
  #leads path.now { stroke: var(--now) !important; stroke-width: 1.5; stroke-opacity: 1; }
  #leads circle { fill: var(--dimmer); }

  /* The word the cue fires on. Underlined rather than filled: a block of colour in
     the middle of a speech is read as emphasis by the actor, which is somebody else's
     instruction. */
  mark.trig {
    background: none; color: inherit;
    border-bottom: 1.5px solid var(--dimmer); padding-bottom: .04em;
  }
  .line.now mark.trig { border-bottom-color: var(--now); }

  #rail {
    position: absolute; top: 0; right: 0; bottom: 0; width: 19em;
    pointer-events: none; z-index: 2; overflow: hidden;
  }
  body[data-rail="off"] #rail { display: none; }
  body[data-rail="on"] #scroller { padding-right: 21em; }
  .cue {
    position: absolute; right: 1.2em; width: 16.5em;
    padding: .4em .7em .45em; border-radius: 3px;
    background: #16181d; border-left: 3px solid var(--dimmer);
    font: 400 .78em/1.35 ui-sans-serif, system-ui, sans-serif;
    color: var(--dim); transition: transform .18s ease-out, opacity .25s, color .25s;
    will-change: transform;
  }
  .cue .what { display: block; }
  /* The operator's own colours, with the sheet's own meanings — filled in at load
     from the cue list, because which they are is a fact about the department. */
  .cue .means {
    display: block; font-size: .74em; letter-spacing: .09em; text-transform: uppercase;
    color: var(--dimmer); margin-bottom: .12em;
  }
  /* A visual cue is not a prompt, it is a responsibility: nothing in the audio will
     ever fire it, and the operator has to be watching the stage. Marked as such. */
  .cue[data-trigger="visual"] { border-left-style: dashed; }
  .cue[data-trigger="visual"] .means::after { content: ' · watch'; color: var(--now); }
  /* Queued at the foot: the next thing coming, before its line is on screen. Kept
     legible rather than merely present — this is the one an operator glances at while
     doing something else. */
  .cue.ahead { opacity: .72; background: #131519; }
  .cue .away { color: var(--speaker); }
  /* Its line is on screen, so it sits beside it. */
  .cue.here { color: var(--fg); background: #1b1f26; }
  /* Its line is the one being spoken. */
  .cue.now { color: var(--now); border-left-color: var(--now); background: #221d12; }
  .cue.review { border-left-style: dotted; }
  /* Not yours to press. Outlined rather than filled, because a card that looks like a
     button is one somebody will reach for — but fully legible, because standing by is
     an instruction too. */
  .cue.auto { background: none; border: 1px dashed var(--dimmer); border-left-width: 3px; }
  .cue.auto .what { color: var(--dim); }
  .cue .standby {
    display: block; margin-top: .15em;
    font: 600 .74em/1.4 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .04em; color: var(--now);
  }
  /* Editable only in prep. A cue moved or retyped mid-show is a cue somebody is not
     watching for, and the rail is the one part of this page an operator reads without
     looking away from the stage. */
  body[data-prep="on"] .cue { pointer-events: auto; cursor: text; }
  body[data-prep="on"] .cue:hover { background: #1d2129; }
  /* On top of its neighbours, always. An open editor is taller than the card it
     replaced, so it overlaps whatever comes next — and the thing you are typing into
     must be the thing in front. */
  .cue.editing {
    background: #1b1f26; cursor: default; z-index: 6;
    box-shadow: 0 6px 24px rgba(0,0,0,.55);
  }
  .cue textarea, .cue input {
    display: block; width: 100%; background: #0f1114; color: var(--fg);
    border: 1px solid var(--dimmer); border-radius: 3px; padding: .25em .4em;
    font: inherit; margin-bottom: .25em;
  }
  .cue textarea { resize: vertical; overflow: hidden; line-height: 1.35; }
  .cue textarea:focus, .cue input:focus { outline: none; border-color: var(--now); }
  .cue .ctl { display: flex; flex-wrap: wrap; gap: .25em; align-items: center; }
  .cue .ctl button {
    border: 1px solid var(--dimmer); background: none; color: var(--dim);
    border-radius: 999px; padding: .15em .55em; cursor: pointer;
    font: 400 .82em/1.4 ui-sans-serif, system-ui, sans-serif;
  }
  .cue .ctl button.on { border-color: var(--now); color: var(--now); }
  .cue .ctl.actions { margin-top: .35em; border-top: 1px solid var(--edge); padding-top: .35em; }
  .cue .ctl button.kill { margin-left: auto; }
  .cue .ctl button.kill.armed { border-color: var(--lost); color: var(--lost); }
  .cue .hintline {
    font: 400 .78em/1.4 ui-sans-serif, system-ui, sans-serif; color: var(--dimmer);
    margin-top: .3em;
  }
  .cue.review .means::after { content: ' · check'; color: var(--lost); }

  #scroller {
    position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
    scrollbar-width: none; padding: 34vh 6vw 66vh;
  }
  #scroller::-webkit-scrollbar { display: none; }

  .line { margin: 0 0 .85em 0; max-width: 46em; transition: color .25s, opacity .25s; }
  .who {
    display: block; font: 600 .68em/1.4 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .09em; text-transform: uppercase; color: var(--speaker);
    opacity: .75; margin-bottom: .15em;
  }
  .scene {
    margin: 2.2em 0 1.2em; padding-top: .8em; border-top: 1px solid var(--edge);
    font: 600 .7em/1.4 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .16em; text-transform: uppercase; color: var(--dimmer);
  }

  /* Lines already spoken recede; lines to come are legible but quiet; the current
     line is the only thing that is bright. Reading position should be findable
     without hunting for it. */
  .line { color: var(--dim); cursor: pointer; }
  .past { color: var(--dimmer); }
  .line.now { color: var(--now); }
  .line:hover { color: var(--fg); }

  /* Cut, but still printed. The operator has to see that the text is there and is
     not going to be said — a page silently missing lines is how you lose your
     place, and a line cut this week may be back next week. */
  .line.cut { text-decoration: line-through; opacity: .38; }
  .line.cut .who { text-decoration: none; }

  /* Stage directions read as a different register, because they are one. Set in the
     same italic the printed script uses, inset, and without a speaker chip — nobody
     is speaking, or if somebody is, it is a performer reading a direction aloud
     rather than a character talking. */
  .line.stage {
    font-style: italic; color: var(--dimmer); max-width: 40em;
    margin-left: 1.4em; padding-left: .9em; border-left: 2px solid var(--edge);
  }
  .line.stage .who { display: none; }
  /* Nobody speaks music, and nobody speaks a silence. The rule is on the hold rather
     than on the kind because a marker inserted from the page inherits the speaker of
     the line above it — so a music cue added mid-scene arrives attributed to whoever
     was last talking, which is worse than unattributed: it reads as a line they say.
     `adlib` keeps its speaker: an improvised passage is still somebody improvising. */
  .line[data-hold="music"] .who,
  .line[data-hold="silence"] .who { display: none; }
  /* Read aloud, so it *is* heard and the matcher does look for it. In this show
     that is Euripides' didascalies, which Séphora reads as part of the performance;
     Rodrigues' own describe what the company does and are never voiced. The operator
     has to be able to tell the two apart at a glance, because it changes whether the
     page is waiting for words that are coming. */
  .line.stage.voiced { border-left-color: var(--speaker); color: var(--dim); }

  /* A hold says why nothing is moving. "Music" is information; a frozen page is a
     fault. This is the same argument as the lost banner, one level quieter. */
  .tag {
    display: inline-block; font: 600 .62em/1.5 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .1em; text-transform: uppercase; vertical-align: .18em;
    padding: .05em .5em; margin-right: .5em; border-radius: 2px;
    background: var(--edge); color: var(--fg); font-style: normal; opacity: .8;
  }
  .line.now .tag { background: var(--now); color: #14110c; opacity: 1; }
  .line.holding.now { color: var(--now); }

  /* A flag is a bookmark, not a state of the show, so it sits in the margin rather
     than changing how the line reads. Visible at a glance while scrolling past. */
  .line.flagged::before {
    content: '';
    position: absolute; left: -1.1em; top: .15em;
    width: .28em; height: 1.05em; border-radius: 1px; background: var(--flag);
  }
  .line { position: relative; }
  .line.stage.flagged::before { left: -1.1em; }

  /* A correction, briefly acknowledged, so a tap that did nothing is obvious. */
  @keyframes placed { from { background: rgba(255,212,121,.28); } to { background: none; } }
  .line.placed { animation: placed .9s ease-out; }

  /* Confidence is weight, never a number: a percentage would be a claim about
     calibration that has not been measured. */
  body[data-conf="word"] .line.now,
  body[data-conf="line"] .line.now { opacity: 1; }
  body[data-conf="block"] .line.now { opacity: .72; }
  body[data-conf="scene"] .line.now { opacity: .5; font-style: italic; }
  body[data-conf="lost"] .line.now { color: var(--dim); opacity: .4; }

  /* Lost is loud on purpose. The measured error distribution is bimodal — on the
     line, or off by tens to hundreds — so the failure to design for is not "slightly
     wrong", it is "confidently elsewhere". This is the GPS saying "recalculating". */
  #hint {
    position: absolute; z-index: 3; left: 50%; bottom: 2.6em; transform: translateX(-50%);
    padding: .35em .9em; border-radius: 999px;
    background: rgba(255,212,121,.12); color: var(--now);
    font: 400 .66em/1.4 ui-sans-serif, system-ui, sans-serif; letter-spacing: .04em;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  body[data-conf="lost"] #hint { opacity: 1; }

  /* What the recogniser heard. Small, out of the way, and readable when you look —
     on a bad channel the transcript is visibly nonsense, which is the fastest way to
     tell "the tracker is broken" apart from "the microphone is". */
  /* A fixed band, not a panel that grows: if it sizes to its contents it is a
     sliver at the start of a run and a different layout ten minutes later, and the
     script box resizes under the reader every time a line arrives. */
  #heard {
    position: relative; z-index: 4;
    flex: 0 0 9em; height: 9em; overflow-y: auto;
    padding: .5em 1.1em .6em; background: #000;
    /* Above the script, so the transcript takes its room from the past rather than
       the future: the reading line sits a third down and everything below it is text
       that has not been said yet, which is the part worth screen space. */
    border-bottom: 1px solid var(--edge);
    font: 400 .66em/1.5 ui-mono, ui-monospace, SFMono-Regular, Menlo, monospace;
    user-select: text; -webkit-user-select: text; cursor: text;
  }
  #heard .head {
    display: flex; align-items: center; gap: .8em; position: sticky; top: -.5em;
    background: #000; padding: .1em 0 .3em; color: var(--dimmer);
    letter-spacing: .09em; text-transform: uppercase; font-size: .84em;
  }
  #heard .head button {
    margin-left: auto; border: 1px solid var(--dimmer); background: none;
    color: var(--dim); border-radius: 999px; padding: .15em .7em; font: inherit;
    cursor: pointer; text-transform: none; letter-spacing: .03em;
  }
  #heard p { margin: .12em 0; color: var(--dimmer); transition: color .3s; }
  #heard p.hit { color: var(--speaker); }
  #heard p.junk { color: var(--lost); opacity: .75; }
  #heard p.tail { color: var(--dim); }
  #heard p.interim { font-style: italic; opacity: .7; }
  body[data-heard="off"] #heard { display: none; }
  #heard p:last-child { margin-bottom: .4em; }

  #lost {
    position: absolute; z-index: 3; left: 0; right: 0; top: 0;
    padding: .6em 1em; text-align: center;
    background: var(--lost); color: #1a0d0b;
    font: 600 .8em/1.3 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .06em; text-transform: uppercase;
    transform: translateY(-100%); transition: transform .2s ease;
  }
  body[data-conf="lost"] #lost { transform: none; }

  footer {
    position: relative; flex: 0 0 auto; z-index: 5;
    display: flex; gap: 1.4em; align-items: center;
    padding: .55em 1.1em; background: rgba(14,15,18,.92);
    border-top: 1px solid var(--edge);
    font: 400 .68em/1.4 ui-sans-serif, system-ui, sans-serif;
    color: var(--dim); letter-spacing: .04em;
  }
  footer b { color: var(--fg); font-weight: 600; }
  #follow {
    margin-left: auto; border: 1px solid var(--dimmer); background: none;
    color: var(--dim); border-radius: 999px; padding: .3em .9em;
    font: inherit; cursor: pointer;
  }
  #follow[hidden] { display: none; }
  /* Edit mode. Deliberately a mode rather than always-on: a click means "we are
     here", which is the control that matters during a run, and a stray click that
     silently rewrote the script would be much worse than one that moved the position. */
  body[data-edit="on"] .line { cursor: text; }
  body[data-edit="on"] .line.now { outline: none; }
  /* Two fields, because a line is two things. Editing them as one blob meant the
     speaker chip was swallowed into the text and had to be retyped — and an
     attribution wrongly imported as dialogue, which is the commonest importer
     mistake, is precisely a case where the speaker is the part that needs fixing. */
  .editor { display: block; margin: 0 0 .85em 0; max-width: 46em; }
  .editor input, .editor textarea {
    display: block; width: 100%; background: #16181d; color: var(--fg);
    border: 1px solid var(--dimmer); border-radius: 4px; padding: .35em .5em;
    font: inherit;
  }
  .editor textarea {
    resize: vertical; overflow: hidden; line-height: 1.5; min-height: 2.4em;
  }
  .editor input.who-field {
    font: 600 .68em/1.4 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .09em; text-transform: uppercase; color: var(--speaker);
    margin-bottom: .3em; border-color: var(--edge);
  }
  .editor input:focus, .editor textarea:focus { outline: none; border-color: var(--now); }
  .editor .row { display: flex; gap: .5em; align-items: center; margin-top: .35em; }
  .editor button {
    border: 1px solid var(--dimmer); background: none; color: var(--dim);
    border-radius: 999px; padding: .25em .8em; cursor: pointer;
    font: 400 .62em/1.4 ui-sans-serif, system-ui, sans-serif; letter-spacing: .05em;
  }
  .editor button.struck { border-color: var(--lost); color: var(--lost); }
  .editor button.on { border-color: var(--now); color: var(--now); }
  /* Inserting is prep-only: it moves every index below it, and the running tracker
     holds a script built once for the whole run. */
  .editor button.insert { display: none; margin-left: auto; }
  body[data-prep="on"] .editor button.insert { display: inline-block; }
  .editor button.danger { display: none; }
  body[data-prep="on"] .editor button.danger { display: inline-block; }
  .editor button.danger.armed { border-color: var(--lost); color: var(--lost); }
  .editor .row .sep { width: 1px; align-self: stretch; background: var(--edge); margin: 0 .2em; }
  .editor .row .label {
    font: 400 .6em/1.4 ui-sans-serif, system-ui, sans-serif;
    color: var(--dimmer); letter-spacing: .06em; text-transform: uppercase;
  }
  .editor input.gone, .editor textarea.gone { text-decoration: line-through; opacity: .45; }
  .editor .keys {
    font: 400 .6em/1.5 ui-sans-serif, system-ui, sans-serif;
    color: var(--dimmer); margin-top: .25em; letter-spacing: .05em;
  }
  body[data-edit="on"] #editing { opacity: 1; }
  #editing {
    position: absolute; z-index: 3; left: 50%; top: .6em; transform: translateX(-50%);
    padding: .3em .9em; border-radius: 999px; background: var(--now); color: #1a0d0b;
    font: 600 .64em/1.4 ui-sans-serif, system-ui, sans-serif; letter-spacing: .05em;
    text-transform: uppercase; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #edit.on { border-color: var(--now); color: var(--now); }

  /* The page reloads from disk, the binary does not. When they disagree, controls
     render and then do nothing — say so rather than letting it look like a bug in
     whatever was just clicked. */
  #stale {
    display: none; position: absolute; z-index: 4; left: 50%; top: .6em;
    transform: translateX(-50%); padding: .35em 1em; border-radius: 999px;
    background: var(--lost); color: #1a0d0b; letter-spacing: .04em;
    font: 600 .64em/1.4 ui-sans-serif, system-ui, sans-serif; text-transform: uppercase;
  }
  body[data-stale="on"] #stale { display: block; }
  body[data-stale="on"] #editing { display: none; }

  #edit {
    margin-left: auto; border: 1px solid var(--dimmer); background: none;
    color: var(--dim); border-radius: 999px; padding: .3em .9em; font: inherit;
    cursor: pointer;
  }
  #ear {
    margin-left: .6em; border: 1px solid var(--dimmer); background: none;
    color: var(--dim); border-radius: 999px; padding: .3em .9em; font: inherit;
    cursor: pointer;
  }
  #follow { margin-left: .6em; }
  /* Naming your own targets. Prep only: what a mark means is a decision about the
     show, not something to change while running it. */
  /* Which list this screen is showing. Available in a run as well as in prep:
     somebody covering another position mid-show should not have to restart anything. */
  #picker { display: inline-flex; gap: .25em; margin-left: .6em; align-items: center; }
  #picker button {
    border: 1px solid var(--dimmer); background: none; color: var(--dim);
    border-radius: 999px; padding: .3em .8em; font: inherit; cursor: pointer;
  }
  #picker button.on { border-color: var(--now); color: var(--now); }
  #picker select {
    border: 1px solid var(--dimmer); background: #16181d; color: var(--dim);
    border-radius: 999px; padding: .3em .8em; font: inherit; cursor: pointer;
  }
  #picker select:focus { outline: none; border-color: var(--now); }
  #picker.single { display: none; }

<script>
(() => {
  const $lines = document.getElementById('lines');
  const $scroller = document.getElementById('scroller');
  const $where = document.getElementById('where');
  const $conf = document.getElementById('conf');
  const $clock = document.getElementById('clock');
  const $follow = document.getElementById('follow');

  let lines = [];
  let els = [];
  let current = -1;
  let following = true;
  // The list is being torn down and rebuilt; scroll events during it are ours.
  let rebuilding = false;


  const fmt = (s) => {
    s = Math.max(0, Math.round(s));
    const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(ss).padStart(2, '0');
  };

  // Rebuilt wholesale after an insert rather than patched. Every index at or after
  // the new line has moved, and `els`, the scene headers and the karaoke pointers all
  // key off index — patching three structures in step is how you get a page whose
  // second half is quietly one line out.
  function build() {
    // Where we were, because rebuilding loses it in two separate ways.
    const wasAt = current, wasConf = document.body.dataset.conf;
    // Emptying #lines collapses the scroll height to nothing, and the browser fires a
    // scroll event for it. The follower tells its own motion from a finger by recency
    // alone — it has to, since it writes scrollTop on almost every frame — so an
    // unmarked rebuild reads as the operator scrolling away, and following is switched
    // off and stays off. That is how autoscrolling vanished mid-run after a reconnect,
    // with nothing on screen to explain it.
    rebuilding = true;
    els.length = 0;
    $lines.textContent = '';
    const frag = document.createDocumentFragment();
    let scene = null;
    lines.forEach((l, i) => {
      if (l.scene !== scene) {
        scene = l.scene;
        const h = document.createElement('div');
        h.className = 'scene';
        h.textContent = scene.replace(/^sc-/, 'scene ');
        frag.appendChild(h);
      }
      const p = document.createElement('p');
      p.dataset.i = i;
      decorate(p, l);
      frag.appendChild(p);
      els[i] = p;
    });
    $lines.appendChild(frag);
    // Every element is new, so none carries `.now` and none is anchored. Left stale,
    // `current` makes the next update for the same line look like no change at all —
    // so the highlight is never re-applied and the page never re-anchors, which reads
    // as the tracking having quietly stopped.
    current = -1;
    scrolledTo = -1;
    lineTops = null;
    // Two frames: the collapse-and-refill scroll event lands before the first.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      rebuilding = false;
      if (wasAt >= 0) show(wasAt, wasConf || 'block');
    }));
  }

  async function loadScript() {
    lines = await (await fetch('script.json')).json();
    build();
    paintFlags();
  }

  // ---- scrolling ------------------------------------------------------------
  //
  // Two behaviours the browser's own `smooth` cannot express. A move of one line while
  // the text is still on screen should glide, because the eye is tracking it and a
  // jerk breaks reading; a relocation across scenes should cut, because pretending to
  // travel there implies a journey that did not happen.
  // A continuous follower rather than a tween per update.
  //
  // Discrete eased hops are irregular by construction: each one accelerates from rest
  // and brakes to a stop, so a run of updates reads as a series of lurches whose
  // rhythm is set by when segments happen to arrive. Holding a target and moving
  // toward it at a bounded speed makes the motion depend on distance alone — the page
  // creeps while the show creeps and travels while it travels, and an update landing
  // mid-move simply changes where it is going without interrupting it.
  const MAX_SPEED = 240;      // px per second: a pace text stays readable through
  const SLOW_SPEED = 55;      // while the tracker says it is unsure
  const MIN_SPEED = 26;       // so the last few pixels do not crawl indefinitely
  let speedCap = MAX_SPEED;
  let scrollTarget = null;
  let lastProgrammatic = 0;
  let lastFrame = 0;

  function follow(now) {
    layoutCues();
    requestAnimationFrame(follow);
    const dt = Math.min(0.05, lastFrame ? (now - lastFrame) / 1000 : 0);
    lastFrame = now;
    if (scrollTarget === null || dt <= 0) return;
    const remaining = scrollTarget - $scroller.scrollTop;
    if (Math.abs(remaining) < 0.6) {
      $scroller.scrollTop = scrollTarget;
      scrollTarget = null;
      lastProgrammatic = now;
      return;
    }
    // Constant speed far out, easing only over the last stretch, so arrivals settle
    // instead of stopping dead.
    const speed = Math.min(speedCap, Math.max(MIN_SPEED, Math.abs(remaining) * 1.6));
    const step = Math.sign(remaining) * Math.min(Math.abs(remaining), speed * dt);
    $scroller.scrollTop += step;
    lastProgrammatic = now;
  }
  requestAnimationFrame(follow);

  function scrollTo(top, instant) {
    if (instant) {
      scrollTarget = null;
      $scroller.scrollTop = top;
      lastProgrammatic = performance.now();
      return;
    }
    scrollTarget = top;
  }

  // Where the window should sit for a given line. Measured from the boxes rather than
  // offsetTop, which is relative to the nearest *positioned* ancestor — #lines became
  // positioned when the race pointers arrived, and every target silently came up short
  // by the scroller's padding.
  function anchorFor(index) {
    const el = els[index];
    if (!el) return null;
    return (
      $scroller.scrollTop +
      el.getBoundingClientRect().top -
      $scroller.getBoundingClientRect().top -
      $scroller.clientHeight * READING_LINE +
      el.offsetHeight / 2
    );
  }

  // Lean toward the next line once this one has gone quiet.
  //
  // A reader's eye is on the next line before the actor has finished the current one,
  // so waiting for confirmation makes the page feel like it trails the room. After a
  // match falls silent the viewport drifts part of the way to the following line: the
  // *scroll* anticipates, the highlight never does. Nothing here claims a position —
  // if the show goes elsewhere the next update simply scrolls there instead.
  let leanTimer = null;
  function lean(index) {
    clearTimeout(leanTimer);
    leanTimer = setTimeout(() => {
      if (!following || openEditor || current !== index) return;
      const here = anchorFor(index), next = anchorFor(index + 1);
      if (here === null || next === null) return;
      scrollTo(here + (next - here) * 0.45, false);
    }, 900);
  }

  function show(index, conf) {
    if (index < 0 || index >= els.length) return;
    if (!els[index] || !els[index].isConnected) {
      // The current line is the one being edited: it is out of the document, so
      // measuring or scrolling to it would read zeros and throw the page to the top.
      document.body.dataset.conf = conf;
      $conf.textContent = conf;
      return;
    }
    document.body.dataset.conf = conf;
    $conf.textContent = conf;
    $where.innerHTML = '<b>' + (lines[index]?.id ?? '') + '</b> of ' + lines.length;

    if (index !== current) {
      if (current >= 0) els[current].classList.remove('now');
      // Everything behind the position recedes; walking the delta keeps this O(moved)
      // rather than O(script) on every update.
      const [from, to] = index > current ? [current + 1, index] : [index, current];
      for (let i = Math.max(0, from); i <= to && i < els.length; i++) {
        els[i].classList.toggle('past', i < index);
      }
      els[index].classList.add('now');
      current = index;
      paintFlags();
    }
    // An open editor freezes the scroll. The show carries on advancing underneath —
    // the position is still live and the footer still moves — but yanking the page
    // out from under somebody mid-correction loses the correction, which is exactly
    // what happened the first time this was used during a run.
    if (!following || openEditor) return;

    // Ease a step, cut a relocation. Gliding across three hundred lines would both
    // look absurd and disguise the fact that something significant just happened.
    // Only move when the line actually changes. Re-anchoring on every update fought
    // the anticipatory drift directly: lean() eases forward, the next segment reports
    // the same line, and the page slid back to where it started — a visible twitch per
    // segment, worst at the opening where segments are densest.
    if (index === scrolledTo) return;

    // An uncertain position is followed *slowly*, not ignored.
    //
    // Suppressing the scroll entirely was worse than the jitter it fixed: the
    // highlight kept walking wherever the tracker wandered while the window stayed
    // put, so the moment confidence recovered the page paid the whole accumulated
    // debt at once — scene 1 to scene 6 in a single leap, reported from a live run.
    // Creeping toward it instead keeps the debt at zero and still refuses to twitch.
    speedCap = conf === 'lost' || conf === 'scene' ? SLOW_SPEED : MAX_SPEED;

    const target = anchorFor(index);
    if (target === null) return;
    scrolledTo = index;
    const distance = Math.abs(target - $scroller.scrollTop);
    // Beyond a screen and a bit, the destination is a different place rather than a
    // further one, so it is cut to rather than travelled to.
    const offScreen = distance > $scroller.clientHeight * 1.2;
    // Duration grows faster than distance, which is the point: a fixed ceiling means
    // a longer move is simply a faster one, and several lines at once flicked past
    // while the reader was still reading them. Holding roughly constant speed instead
    // keeps a three-line advance legible — the text stays readable *through* the move,
    // which is what a page being read has to do and a page being animated does not.
    // Only cut when the tracker is confident. Cutting on an uncertain relocation is
    // how a guess becomes a jump-scare.
    scrollTo(target, offScreen && speedCap === MAX_SPEED);
    lean(index);
  }

  $scroller.addEventListener('scroll', () => {
    if (rebuilding) return;
    // The follower writes scrollTop on almost every frame, so a counter with timeouts
    // cannot tell its own motion from a finger. Recency can: anything within a couple
    // of frames of our last write was us.
    if (performance.now() - lastProgrammatic < 120) return;
    if (following) { following = false; $follow.hidden = false; }
  }, { passive: true });

  $follow.addEventListener('click', () => {
    following = true;
    $follow.hidden = true;
    // Force a re-anchor: the reader has asked to come back, so the usual
    // same-line-means-stay-put rule does not apply.
    scrolledTo = -1;
    if (current >= 0) show(current, document.body.dataset.conf);
  });

  // Click a line to say "we are here". The tracker is forward-only and, when it is
  // wrong, is usually wrong by a lot — so the fastest route back is the person who
  // can see the page. The GPS does not argue with the driver.
  let ws = null;
  let editing = false;
  const $edit = document.getElementById('edit');
  const setEditing = (on) => {
    editing = on;
    document.body.dataset.edit = on ? 'on' : 'off';
    $edit.classList.toggle('on', on);
  };
  $edit.addEventListener('click', () => setEditing(!editing));

  // Prep mode: no audio, no recognition, and 931 lines to walk through. Editing is
  // the whole reason the page is open, so it starts on, and the one control that
  // matters is being able to reach a passage without scrolling for a minute.
  const $find = document.getElementById('find');
  const goTo = (index, flash) => {
    const el = els[index];
    if (!el) return;
    scrollTo(anchorFor(index), true);
    if (!flash) return;
    el.classList.remove('placed');
    void el.offsetWidth;
    el.classList.add('placed');
  };
  let hits = [], hitAt = -1;
  $find.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') { $find.value = ''; $find.blur(); return; }
    if (ev.key !== 'Enter') return;
    ev.preventDefault();
    const q = $find.value.trim().toLowerCase();
    if (!q) return;
    // A line number if it looks like one, otherwise text. Both are things an operator
    // actually says out loud — "go to 412", "find the Otis Redding bit".
    const asNumber = /^\d+$/.test(q) ? Math.min(lines.length, Math.max(1, +q)) - 1 : null;
    if (asNumber !== null) { hits = [asNumber]; hitAt = 0; jumpedTo = asNumber; goTo(asNumber, true); return; }
    const again = hits.length && hits.query === q;
    if (!again) {
      hits = lines.reduce((a, l, i) => {
        if ((l.text + ' ' + (l.character || '')).toLowerCase().includes(q)) a.push(i);
        return a;
      }, []);
      hits.query = q;
      hitAt = -1;
    }
    if (!hits.length) { $find.classList.add('miss'); setTimeout(() => $find.classList.remove('miss'), 600); return; }
    // Enter again steps to the next occurrence, which is how every find box works.
    hitAt = (hitAt + 1) % hits.length;
    $find.dataset.count = `${hitAt + 1}/${hits.length}`;
    jumpedTo = hits[hitAt];
    goTo(hits[hitAt], true);
  });

  // ---- the cue rail -----------------------------------------------------------
  //
  // Two behaviours the operator asked for, and they turn out to be one rule.
  //
  //   "have the next visible one displayed as soon as the previous is gone by, even
  //    if the linked text block is visible already or not. Then once the relevant
  //    block is displayed follow its position and as soon as possible display the
  //    next below it"
  //
  // So a cue whose line is on screen sits beside that line; a cue whose line is still
  // below the fold waits at the bottom of the rail rather than being invisible, because
  // the whole value of a cue list is knowing what is *coming*. Both fall out of one
  // clamp: put the cue at its line's height, but never above the cue before it, and
  // never past the bottom of the rail. A line below the fold clamps to the bottom and
  // queues; as it scrolls in, its natural height drops below the clamp and it rises to
  // meet its line of its own accord. Nothing switches modes.
  const $rail = document.getElementById('rail');
  const $leads = document.getElementById('leads');
  let leadEls = [];
  let cues = [];
  // What this screen is drawing: the chosen list, in script order. Every index in
  // `cueEls`, `cueAway` and the layout refers to *this*, never to the full set — the
  // two diverge the moment a list is selected, and conflating them would put a lighting
  // cue's tendril on a sound cue's card.
  let shown = [];
  let cueEls = [];
  let cueAway = [];
  // Line offsets, cached: this runs every animation frame, and asking the browser for
  // 133 bounding rectangles per frame would cost more than everything else on the page
  // put together. Invalidated whenever the list is rebuilt or the window resizes.
  let lineTops = null, lineHeights = null, cueHeights = null, railH = 0, linesTop = 0;

  // One pass, then read from arrays. Every `offsetTop` or `offsetHeight` inside the
  // frame loop forces the browser to settle layout before answering, and there are
  // 133 cues: asking each of them twice per frame is a few hundred forced reflows a
  // frame, which is a page that stutters rather than scrolls.
  function measure() {
    lineTops = new Float64Array(els.length);
    lineHeights = new Float64Array(els.length);
    for (let i = 0; i < els.length; i++) {
      if (!els[i]) continue;
      lineTops[i] = els[i].offsetTop;
      lineHeights[i] = els[i].offsetHeight;
    }
    cueHeights = cueEls.map((el) => el.offsetHeight || 44);
    railH = $rail.clientHeight;
    linesTop = $lines.offsetTop;
  }

  async function loadCues() {
    try {
      const list = await fetch('sheets.json');
      if (list.ok) sheets = await list.json();
    } catch { /* an older server has no lists; the rail still works uncoloured */ }
    try {
      const r = await fetch('cues.json');
      if (!r.ok) return;
      cues = await r.json();
    } catch { return; }
    // An unknown list — a stale bookmark, a renamed file — falls back to the first
    // rather than to an empty rail, which would read as "no cues tonight".
    if (viewing && viewing !== '*' && !sheetOf(viewing)) viewing = null;
    if (!viewing) viewing = sheets.length === 1 ? sheets[0].id : '*';
    paintCategoryRules();
    paintPicker();
    paintFilters();
    renderRail();
  }

  // Cues on the list this screen is showing, in script order.
  // Categories switched off on this screen. Per sheet, because a key means different
  // things on different lists — `blue` is QLab here and nothing at all over there.
  const muted = new Set(JSON.parse(localStorage.getItem('choufleur.muted') || '[]'));
  const isMuted = (c) => muted.has(`${c.sheet}/${c.colour || ''}`);

  const mine = () =>
    (viewing === '*' ? cues : cues.filter((c) => c.sheet === viewing)).filter((c) => !isMuted(c));

  // One toggle per category the showing list defines, plus one for cues with none.
  //
  // This is what replaces the production-wide cue-type registry the notation spec used
  // to carry. A list names its own targets, so filtering on them leaves the vocabulary
  // open — a lighting operator screens out followspot cues by the name they gave them,
  // without anyone having had to register `FOLLOW` as a type first.
  function paintFilters() {
    const $f = document.getElementById('filters');
    $f.textContent = '';
    const sheetsShown = viewing === '*' ? sheets : sheets.filter((sh) => sh.id === viewing);
    const cats = sheetsShown.flatMap((sh) => (sh.categories || []).map((c) => [sh.id, c]));
    // Nothing to filter on when a list has one target or none.
    $f.classList.toggle('single', cats.length < 2);
    if (cats.length < 2) return;
    const add = (key, label, swatch, count) => {
      const b = document.createElement('button');
      b.className = 'cat';
      b.textContent = count === null ? label : `${label} ${count}`;
      b.style.borderLeftColor = swatch || 'var(--dimmer)';
      b.classList.toggle('off', muted.has(key));
      b.onclick = () => {
        muted.has(key) ? muted.delete(key) : muted.add(key);
        localStorage.setItem('choufleur.muted', JSON.stringify([...muted]));
        paintFilters();
        renderRail();
        replace();
      };
      $f.appendChild(b);
    };
    for (const [sid, c] of cats) {
      const n = cues.filter((q) => q.sheet === sid && q.colour === c.key).length;
      add(`${sid}/${c.key}`, c.label, c.swatch, n);
    }
    const none = cues.filter((q) => sheetsShown.some((sh) => sh.id === q.sheet) && !q.colour);
    if (none.length) add(`${sheetsShown[0].id}/`, 'uncategorised', null, none.length);
  }

  // Paint the marks and cards from the list, so a department that does not use these
  // colours is not stuck with them.
  function paintCategoryRules() {
    // Scoped by sheet, because two lists may use the same key for different colours —
    // that is what independence means, and an unscoped rule would let the lighting
    // list repaint the sound list's cards.
    document.getElementById('catstyle').textContent = sheets
      .flatMap((sh) => (sh.categories || []).map((c) =>
        `.cue[data-sheet="${sh.id}"][data-colour="${c.key}"] { border-left-color: ${c.swatch}; }\n`
        + `mark.trig[data-sheet="${sh.id}"][data-colour="${c.key}"] { border-bottom-color: ${c.swatch}; }`))
      .join('\n');
  }

  function renderRail() {
    // Rebuilding throws away every card, so an open editor would vanish mid-sentence
    // — and `cueEditing` would be left pointing at a card that no longer exists,
    // freezing the layout for good. Commit it first.
    if (openCue) openCue();
    // Filter first, then decide whether there is a rail to show. Reading `shown`
    // before assigning it used the *previous* render's list, which on a fresh load is
    // empty — so the rail hid itself on the one pass where nothing could correct it.
    shown = mine();
    document.body.dataset.rail = shown.length ? 'on' : 'off';
    // Only one mark per line: two cues on the same line would fight over the text,
    // and the second leader can point at the first one's mark perfectly well.
    // The union of before and after, not just after.
    //
    // Re-rendering only the lines that *have* a trigger leaves a line that has just
    // lost its last one untouched — so the underline stays under words that no longer
    // fire anything, which is a lie the page keeps telling until something else
    // happens to redraw that line.
    const had = new Set(triggerOf.keys());
    triggerOf = new Map();
    for (const c of shown) {
      if (!c.triggerText) continue;
      if (!triggerOf.has(c.lineIndex)) triggerOf.set(c.lineIndex, []);
      triggerOf.get(c.lineIndex).push({
        id: c.id, text: c.triggerText, colour: c.colour, sheet: c.sheet,
        nth: c.triggerNth || 0,
      });
    }
    for (const i of new Set([...had, ...triggerOf.keys()])) {
      if (els[i]) decorate(els[i], lines[i]);
    }
    lineTops = null;
    $rail.textContent = '';
    cueAway = [];
    cueEls = shown.map((c) => {
      const el = document.createElement('div');
      el.className = 'cue' + (c.needsReview ? ' review' : '')
        + (c.firedBy === 'auto' ? ' auto' : '');
      if (c.colour) el.dataset.colour = c.colour;
      el.dataset.sheet = c.sheet;
      el.dataset.trigger = c.trigger;
      const means = document.createElement('span');
      means.className = 'means';
      // Written in JS rather than through `content: attr(...)`: attr() reads from the
      // element the pseudo-element belongs to, not from its parent, so a data attribute
      // set on the card would have rendered as nothing at all.
      const away = document.createElement('span');
      away.className = 'away';
      means.append(away, document.createTextNode(c.means || c.trigger));
      const what = document.createElement('span');
      what.className = 'what';
      what.textContent = c.cue;
      el.append(means, what);
      // A machine fires this one and the operator is on standby. It keeps its place in
      // the rail and its lookahead slot — knowing it is coming is the whole point of
      // standing by — but it is drawn as something to watch rather than something to
      // press, and it says what fires it.
      if (c.firedBy === 'auto') {
        const by = document.createElement('span');
        by.className = 'standby';
        by.textContent = c.via ? `standby — ${c.via}` : 'standby — fires itself';
        el.appendChild(by);
      }
      $rail.appendChild(el);
      cueAway.push(away);
      return el;
    });
    requestAnimationFrame(() => { lineTops = null; layoutCues(); });
  }

  const CUE_GAP = 6;
  // How many cues wait at the foot of the rail before their lines arrive.
  //
  // The first version reserved nothing, and the queued cue was simply the next one
  // that happened to fit. That works on a quiet stretch and fails exactly when it
  // matters: on a busy page the cues anchored to visible lines fill the rail, the
  // lookahead is pushed off the bottom, and the operator loses sight of what is coming
  // at the moment there is most to keep track of. So the foot of the rail is reserved
  // for them and the anchored cues get what is left.
  const LOOKAHEAD = 2;

  function layoutCues() {
    if (!shown.length) return;
    // Frozen while a cue is open.
    //
    // Two faults, one cause. The card grows when it becomes an editor, so every
    // measurement taken of it is stale and the cards after it are placed as though it
    // were still small — they slide underneath. And the layout runs every frame, so
    // the moment the operator scrolls to select a phrase, the whole rail slides and
    // the card they are typing into goes with it.
    //
    // Editing a cue is a modal activity for the *cards*: they hold still until it is
    // finished, then re-measure and settle. Reported from the chair as cues slipping
    // under each other and "the display of the cues jump around".
    //
    // The tendrils are the opposite case and freezing them was wrong. A card is fixed
    // while the script scrolls under it — which is the whole point, since scrolling is
    // how the operator reaches the words they want to select — so a tendril that does
    // not follow ends up pointing at a line that has moved on. "Things get confusing"
    // is generous. Cards frozen, tendrils live.
    const frozen = cueEditing >= 0;
    if (!lineTops) measure();
    const top = $scroller.scrollTop;
    const fold = railH;                 // below this, a line is not on screen yet

    // Split first, place second. Which band a cue belongs to is a fact about the
    // script and the scroll; where it is drawn is a consequence.
    const gone = [], here = [], ahead = [];
    for (let k = 0; k < shown.length; k++) {
      const c = shown[k];
      if (!els[c.lineIndex]) { gone.push(k); continue; }
      const y = lineTops[c.lineIndex] + linesTop - top;
      // Gone by: its line has left the top of the window. Cues do not linger — the
      // operator has either taken it or missed it, and a spent cue on screen competes
      // with the one that is next.
      if (y + lineHeights[c.lineIndex] < 0) gone.push(k);
      else if (y < fold) here.push([k, y]);
      else ahead.push([k, y]);
    }
    // Not while frozen: hiding the card being edited would take the editor with it.
    if (!frozen) for (const k of gone) cueEls[k].style.display = 'none';

    // Reserve the foot for the lookahead, then fill upwards from the top with the
    // cues whose lines are actually on screen.
    const queued = ahead.slice(0, LOOKAHEAD);
    let reserved = 0;
    for (const [k] of queued) reserved += (cueHeights[k] || 44) + CUE_GAP;
    const ceiling = Math.max(0, railH - reserved);

    let floor = 0;
    for (const [k, y] of here) {
      if (frozen) break;
      const el = cueEls[k], h = cueHeights[k] || 44;
      const want = Math.max(floor, Math.min(y, ceiling - h));
      if (want + h > ceiling && floor > 0) { el.style.display = 'none'; continue; }
      el.style.display = '';
      el.style.transform = `translateY(${Math.round(want)}px)`;
      el.classList.remove('ahead');
      el.classList.add('here');
      if (cueAway[k].textContent) cueAway[k].textContent = '';
      el.classList.toggle('now', shown[k].lineIndex === current);
      floor = want + h + CUE_GAP;
    }

    // The lookahead, stacked at the foot, with how far off each one is. "What" is on
    // the card already; the only thing missing is "when".
    const from = current >= 0 ? current : (here.length ? shown[here[0][0]].lineIndex : 0);
    let y = railH - reserved + CUE_GAP;
    for (const [k] of queued) {
      if (frozen) break;
      const el = cueEls[k], h = cueHeights[k] || 44;
      el.style.display = '';
      el.style.transform = `translateY(${Math.round(y)}px)`;
      el.classList.add('ahead');
      el.classList.remove('here', 'now');
      const away = shown[k].lineIndex - from;
      cueAway[k].textContent = away > 0 ? `in ${away} line${away === 1 ? '' : 's'} · ` : '';
      y += h + CUE_GAP;
    }
    if (!frozen) {
      for (let i = LOOKAHEAD; i < ahead.length; i++) cueEls[ahead[i][0]].style.display = 'none';
    }
    // Always. The card being edited is usually the one whose line the operator is
    // scrolling to, so its tendril is the one that most needs to keep up.
    drawLeads(frozen ? here.concat(ahead.filter(([k]) => k === cueEditing)) : here);
  }

  // A line from the cue to the thing that fires it.
  //
  // A card on the right and a word on the left are two halves of one instruction, and
  // an operator should not have to work out which pairs with which — on a page with
  // three cues in view, matching them by eye is exactly the kind of small tax that
  // costs a cue at the wrong moment.
  //
  // Drawn only for cues whose line is on screen. `getBoundingClientRect` on the mark
  // is unavoidable — an inline span's position is not derivable from anything cached —
  // but there are at most a handful in view, unlike the 133 cards.
  const NS = 'http://www.w3.org/2000/svg';
  // Filled from the cue list rather than written here. See CueList in live.rs: a
  // lighting sheet means an Eos by the same marks this sound sheet means QLab by, and
  // neither of them is the page's business to know.
  // Every list this show carries, and which one this screen is showing.
  //
  // The lists are independent documents — one operator's notation is not another's —
  // so a screen shows exactly one, or "everything" for a stage manager who is watching
  // the whole board. The choice is this device's: a URL wins so a fixed install can be
  // set once and cannot be changed by somebody walking past it, otherwise the picker,
  // remembered here.
  let sheets = [];
  let viewing = new URLSearchParams(location.search).get('list')
    || localStorage.getItem('choufleur.list')
    || null;
  const deviceId = (() => {
    let d = localStorage.getItem('choufleur.device');
    if (!d) { d = crypto.randomUUID(); localStorage.setItem('choufleur.device', d); }
    return d;
  })();
  const sheetOf = (id) => sheets.find((s) => s.id === id);
  // The categories in force are the showing list's. With "everything" selected there is
  // no single vocabulary, so every list's categories are pooled — ids are per-list and
  // may repeat, which is exactly why a cue is painted from *its own* sheet's set.
  const catFor = (cue) => (sheetOf(cue.sheet)?.categories || []).find((c) => c.key === cue.colour);
  const CUE_STROKE = (cue) => catFor(cue)?.swatch || '';
  let cueCats = [];

  // Where the rendered text of a line stops, as opposed to where its box stops.
  // Only ever called for the handful of cues in view.
  const measureRange = document.createRange();
  function endOfText(line) {
    const nodes = [...line.childNodes].filter(
      (n) => (n.nodeType === 3 && n.textContent.trim()) || n.nodeName === 'MARK'
    );
    const last = nodes[nodes.length - 1];
    if (!last) return null;
    measureRange.selectNodeContents(last);
    const rects = measureRange.getClientRects();
    return rects.length ? rects[rects.length - 1] : null;
  }
  function drawLeads(here) {
    const stage = $leads.getBoundingClientRect();
    const colRight = $lines.getBoundingClientRect().right;

    // Measure everything first, then draw.
    //
    // Two cues on the same visual row leave at the same height and their horizontal
    // runs lie exactly on top of each other — one line where there are two, and no way
    // to tell which card owns which phrase. That can only be seen once every anchor is
    // known, so measuring and drawing are separate passes and the offsets are worked
    // out in between.
    const jobs = [];
    for (const [k] of here) {
      const card = cueEls[k];
      if (card.style.display === 'none') continue;
      const line = els[shown[k].lineIndex];
      if (!line) continue;
      // The *last* rect, not the bounding box. A phrase that wraps spans two rows, and
      // their union is a box whose right edge belongs to one row and whose bottom
      // belongs to the other — so the tendril would leave from a corner where there is
      // no text at all. The cue fires when the phrase finishes, so the end of the last
      // row is both the correct anchor and the honest one.
      const mark = line.querySelector(`mark.trig[data-cue="${shown[k].id}"]`);
      const rects = mark ? mark.getClientRects() : null;
      const t = rects && rects.length ? rects[rects.length - 1] : endOfText(line);
      if (!t || t.bottom < stage.top || t.top > stage.bottom) continue;
      jobs.push({ k, t, c: card.getBoundingClientRect() });
    }

    // Rows of roughly the same height share a lane each. Centred on the true height,
    // so a lone tendril is not nudged off its underline to make room for nobody.
    const ROW = 8, LANE = 3.5, FAN = 7;
    const rows = new Map();
    for (const j of jobs) {
      const key = Math.round((j.t.bottom - stage.top) / ROW);
      if (!rows.has(key)) rows.set(key, []);
      rows.get(key).push(j);
    }
    for (const group of rows.values()) {
      group.sort((p, q) => p.t.right - q.t.right);
      group.forEach((j, i) => {
        // Downwards only. Centring shared a row fairly and lifted the first tendril
        // off its own underline and up into the descenders of the words above — the
        // one direction there is no room in. Below the text there is nothing but the
        // gap to the next line.
        j.lane = i * LANE;
        // Fan the turns as well, or the curves merge again in the gutter even when
        // the straight runs are apart.
        j.fan = i * FAN;
      });
    }

    while (leadEls.length < jobs.length) {
      const path = document.createElementNS(NS, 'path');
      const dot = document.createElementNS(NS, 'circle');
      dot.setAttribute('r', '0');
      $leads.append(path, dot);
      leadEls.push([path, dot]);
    }
    for (let n = jobs.length; n < leadEls.length; n++) leadEls[n][0].setAttribute('d', '');

    jobs.forEach((j, n) => {
      const [path] = leadEls[n];
      // The underline continues into the tendril: it leaves from the end of the phrase
      // at the underline's own height and runs beneath the words that follow — at
      // descender level, not through the letters — before turning for the card.
      const x1 = j.t.right - stage.left;
      const y1 = j.t.bottom - stage.top + 1 + (j.lane || 0);
      const x2 = j.c.left - stage.left - 4;
      const y2 = j.c.top - stage.top + 14;
      // Straight under the remaining words to the edge of the column, then a curve.
      // A bezier from the word directly would sweep up through the line above it.
      const from = Math.max(colRight - stage.left + 4 + (j.fan || 0), x1);
      const bend = Math.max(24, (x2 - from) * 0.4);
      path.setAttribute('d',
        `M${x1.toFixed(1)},${y1.toFixed(1)} H${from.toFixed(1)} `
        + `C${(from+bend).toFixed(1)},${y1.toFixed(1)} ${(x2-bend).toFixed(1)},${y2.toFixed(1)} `
        + `${x2.toFixed(1)},${y2.toFixed(1)}`);
      // The cue's own colour, so several tendrils leaving one paragraph are told apart
      // by the same code as their cards — and so a line running under a sentence is
      // read as belonging to the rail rather than as part of the typography.
      path.style.stroke = CUE_STROKE(shown[j.k]);
      path.classList.toggle('now', shown[j.k].lineIndex === current);
    });
  }

  // The list picker. Hidden when a show has only one list, because a control with a
  // single option is furniture.
  const $picker = document.getElementById('picker');
  function paintPicker() {
    $picker.textContent = '';
    $picker.classList.toggle('single', sheets.length < 2);
    if (sheets.length < 2) return;
    const choose = (id) => {
      viewing = id;
      localStorage.setItem('choufleur.list', id);
      paintPicker();
      paintCategoryRules();
      paintFilters();
      renderRail();
      replace();
    };
    // Everything at once is the stage manager's view, and how you check that two lists
    // do not disagree about where a moment sits.
    const options = [...sheets.map((sh) => [sh.id, sh.name]), ['*', 'all']];
    // Buttons while they fit, a menu once they do not. A real board runs to a dozen
    // lists — three followspots, two stage managers, flys, surtitles — and a dozen
    // buttons in a footer wrap into two rows and push the clock off the end. Below
    // that, buttons are the better target on a touch screen in the dark.
    if (options.length <= 5) {
      for (const [id, name] of options) {
        const b = document.createElement('button');
        b.textContent = name;
        b.classList.toggle('on', viewing === id);
        b.onclick = () => choose(id);
        $picker.appendChild(b);
      }
      return;
    }
    const sel = document.createElement('select');
    for (const [id, name] of options) {
      const o = document.createElement('option');
      o.value = id;
      o.textContent = name;
      o.selected = viewing === id;
      sel.appendChild(o);
    }
    sel.onchange = () => choose(sel.value);
    $picker.appendChild(sel);
  }

  // ---- the targets a cue list drives ------------------------------------------
  //
  // "A colour palette for the various categories of actions is fine. The user should
  // be able to pick their own."
  //
  // A category's *key* is never edited here. A cue stores its category by key, so
  // renaming "QLab" to "QLab 5" must not orphan seventy cues — the label and the
  // colour are the operator's to change freely, the key is bookkeeping.
  //
  // Chosen from a palette rather than a colour input. These are read at a glance, in
  // the dark, next to each other, and an unconstrained picker mostly produces colours
  // that are indistinguishable at a 3-pixel rule or invisible on this background.
  const PALETTE = [
    '#4d7ea8', '#8566ad', '#5f9e6a', '#c8a33a', '#c07a3a', '#c0564a',
    '#4aa3a0', '#a8628c', '#8a9440', '#7a8088',
  ];
  const $palette = document.getElementById('palette');
  const $targets = document.getElementById('targets');
  let draft = null;

  const slug = (s) =>
    s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  // The list whose vocabulary the targets panel edits: the one being shown, or the
  // first when showing everything — "all" is a view, not a list, and has no categories
  // of its own to edit.
  const targetSheet = () => (viewing === '*' ? (sheets[0]?.id || '') : viewing);

  function openTargets() {
    cueCats = sheetOf(targetSheet())?.categories || [];
    draft = cueCats.map((c) => ({ ...c }));
    document.body.dataset.palette = 'on';
    $targets.classList.add('on');
    paintTargets();
  }
  function closeTargets() {
    draft = null;
    document.body.dataset.palette = 'off';
    $targets.classList.remove('on');
  }

  function paintTargets() {
    $palette.textContent = '';
    const h = document.createElement('h4');
    h.textContent = 'what this cue list drives';
    $palette.appendChild(h);
    draft.forEach((cat, n) => {
      const row = document.createElement('div');
      row.className = 'target';
      const name = document.createElement('input');
      name.value = cat.label;
      name.placeholder = 'QLab, Eos, console, followspot…';
      name.oninput = () => { cat.label = name.value; };
      const sw = document.createElement('div');
      sw.className = 'swatches';
      PALETTE.forEach((hex) => {
        const b = document.createElement('button');
        b.style.background = hex;
        b.classList.toggle('on', cat.swatch === hex);
        b.title = hex;
        b.onclick = (e) => {
          e.preventDefault();
          cat.swatch = hex;
          [...sw.children].forEach((c, i) => c.classList.toggle('on', PALETTE[i] === hex));
        };
        sw.appendChild(b);
      });
      const drop = document.createElement('button');
      drop.className = 'drop';
      drop.textContent = 'remove';
      drop.onclick = (e) => {
        e.preventDefault();
        draft.splice(n, 1);
        paintTargets();
      };
      row.append(name, sw, drop);
      $palette.appendChild(row);
    });

    const foot = document.createElement('div');
    foot.className = 'foot';
    const add = document.createElement('button');
    add.textContent = 'add a target';
    add.onclick = (e) => {
      e.preventDefault();
      draft.push({ key: '', label: '', swatch: PALETTE[draft.length % PALETTE.length] });
      paintTargets();
    };
    const cancel = document.createElement('button');
    cancel.textContent = 'cancel';
    cancel.onclick = (e) => { e.preventDefault(); closeTargets(); };
    const save = document.createElement('button');
    save.className = 'save';
    save.textContent = 'save';
    save.onclick = (e) => {
      e.preventDefault();
      // A new target earns its key from its name; an existing one keeps the key it
      // has, whatever it is now called.
      const taken = new Set();
      const cats = draft
        .filter((c) => c.label.trim() || c.key)
        .map((c) => {
          let key = c.key || slug(c.label) || 'target';
          while (taken.has(key)) key += '-2';
          taken.add(key);
          return { key, label: c.label.trim() || key, swatch: c.swatch };
        });
      ws.send(JSON.stringify({
        type: 'edit_categories', sheet: targetSheet(), categories: cats,
      }));
      closeTargets();
    };
    foot.append(add, cancel, save);
    $palette.appendChild(foot);

    const note = document.createElement('div');
    note.className = 'note';
    note.textContent = 'Renaming is safe — cues stay attached. Removing a target leaves '
      + 'its cues uncoloured rather than deleting them.';
    $palette.appendChild(note);
  }

  $targets.addEventListener('click', () => (draft ? closeTargets() : openTargets()));

  // ---- editing a cue ----------------------------------------------------------
  //
  // In prep only. A cue retyped or moved mid-show is a cue nobody is watching for, and
  // the rail is the part of this page an operator reads without looking away from the
  // stage.
  //
  // The trigger phrase is set from a selection in the script rather than typed. Typing
  // it means retyping the playwright, and a phrase that does not appear in the line
  // exactly cannot be marked — so the operator would be debugging their own spelling
  // against somebody else's punctuation. Selecting is also how you would say it out
  // loud: point at the words.
  // What the operator has selected in the script, as a phrase that really occurs in
  // one line's text.
  //
  // `getSelection().toString()` is not that. The speaker sits in a block-level span
  // inside the same paragraph, so dragging from the visual start of a line — the
  // obvious gesture — picks up the character's name and a newline, and the result
  // matches nothing. So the name is stripped when the selection begins with it, and
  // whitespace is collapsed, before asking whether the phrase is really in the line.
  function selectionInScript() {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.anchorNode) return null;
    const node = sel.anchorNode.nodeType === 3 ? sel.anchorNode.parentElement : sel.anchorNode;
    const el = node && node.closest ? node.closest('.line') : null;
    if (!el) return null;
    // One line only: a phrase spanning two of them is not a trigger, it is a mistake.
    const end = sel.focusNode?.nodeType === 3 ? sel.focusNode.parentElement : sel.focusNode;
    if (end && end.closest && end.closest('.line') !== el) return null;
    const index = Number(el.dataset.i);
    const line = lines[index];
    if (!line) return null;
    // Which characters, not just which characters *look like* these.
    //
    // Taking the selection as a string and finding it with indexOf always returns the
    // first occurrence, so selecting the third "Comme ça." in a speech marked the
    // first one. A play repeats itself constantly — that is half of what today's
    // tracking work has been about — so the position has to be carried, not inferred.
    //
    // Carried as an occurrence count rather than a character offset: it survives an
    // edit elsewhere in the line, and it sidesteps the two sides disagreeing about
    // what an index means, since each counts occurrences in its own string.
    const range = sel.getRangeAt(0);
    const start = textOffset(el, range.startContainer, range.startOffset);
    const stop = textOffset(el, range.endContainer, range.endOffset);
    if (stop === null) return null;
    let at = start === null ? 0 : start;
    const raw = line.text.slice(at, stop);
    at += raw.length - raw.trimStart().length;
    const text = raw.trim();
    if (!text) return null;
    // How many identical phrases precede it.
    let nth = 0;
    for (let p = line.text.indexOf(text); p >= 0 && p < at; p = line.text.indexOf(text, p + 1)) nth++;
    return { index, text, nth };
  }

  // Where a DOM position sits within the line's *script text*, ignoring the speaker
  // chip and the hold badge — which are inside the same paragraph but are not part of
  // what the playwright wrote. Null when the position is inside one of them.
  function textOffset(lineEl, node, offset) {
    let acc = 0, done = false;
    const walk = (n) => {
      if (done) return;
      if (n === node) {
        acc += n.nodeType === 3 ? offset : 0;
        done = true;
        return;
      }
      if (n.nodeType === 3) { acc += n.textContent.length; return; }
      if (n.classList && (n.classList.contains('who') || n.classList.contains('tag'))) return;
      for (const c of n.childNodes) walk(c);
    };
    for (const c of lineEl.childNodes) walk(c);
    return done ? acc : null;
  }

  let openCue = null;
  // Which card is currently an editor, or -1. Separate from `openCue` because the
  // layout has to know from the first instant, before the closure exists.
  let cueEditing = -1;
  // Set when this client asked for a cue, so it — and only it — opens the new card.
  let pendingCueFor = null;

  function editCue(k) {
    if (openCue) openCue();
    // Set before anything is measured or appended: the layout runs on the next frame
    // regardless, and one pass taken while the card is halfway to being an editor
    // places everything below it wrongly.
    cueEditing = k;
    const el = cueEls[k], c = shown[k];
    const before = el.innerHTML;
    el.classList.add('editing');
    el.innerHTML = '';

    const what = document.createElement('textarea');
    what.rows = 2;
    what.value = c.cue;
    const fit = () => { what.style.height = 'auto'; what.style.height = what.scrollHeight + 'px'; };
    what.addEventListener('input', fit);

    let trigger = c.trigger, colour = c.colour || '', triggerText = c.triggerText || '';
    let moveTo = c.lineIndex;
    let triggerNth = c.triggerNth || 0;
    let firedBy = c.firedBy === 'auto' ? 'auto' : 'operator';
    let via = c.via || '';
    const ctl = document.createElement('div');
    ctl.className = 'ctl';
    const mk = (label, isOn, onClick) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.onmousedown = (e) => e.preventDefault();
      b.onclick = (e) => { e.preventDefault(); onClick(); repaint(); };
      b.dataset.on = isOn;
      return b;
    };
    const bText = mk('text', 'trigger:text', () => { trigger = 'text'; });
    const bVis  = mk('visual', 'trigger:visual', () => { trigger = 'visual'; });
    // One button per category the list defines, in the list's own words.
    const catBtns = cueCats.map((cat) =>
      mk(cat.label, 'never', () => { colour = colour === cat.key ? '' : cat.key; })
    );
    const bTrig = mk('use selection', 'never', () => {
      const picked = selectionInScript();
      if (!picked) {
        hint.textContent = 'select some words in the script, within one line';
        return;
      }
      // A new reference replaces the old one *and* moves the cue to the line it is
      // in. Requiring the selection to be inside the cue's current line was the wrong
      // rule twice over: it made re-anchoring impossible from the page, and it was
      // what fired when the selection reached back over the speaker's name — which
      // is the natural thing to do when you drag from the start of a line.
      triggerText = picked.text;
      triggerNth = picked.nth;
      moveTo = picked.index;
      hint.textContent = picked.index === c.lineIndex
        ? ''
        : `will move to ${lines[picked.index].id}`;
    });
    const bClear = mk('no trigger word', 'never', () => { triggerText = ''; triggerNth = 0; hint.textContent = ''; });
    // For a stage direction there is usually no word to point at — the whole thing is
    // the reference, and "Chorégraphie sur la musique d'Otis Redding" is the cue.
    // Select any part of it and this moves the cue there with no trigger phrase.
    const bWhole = mk('use whole line', 'never', () => {
      const picked = selectionInScript();
      if (!picked) { hint.textContent = 'select any part of the line you want'; return; }
      triggerText = '';
      triggerNth = 0;
      moveTo = picked.index;
      const l = lines[picked.index];
      hint.textContent = `fires on all of ${l.id}${l.kind === 'stage' ? ' (stage direction)' : ''}`;
    });
    const kill = document.createElement('button');
    kill.className = 'kill';
    kill.textContent = 'delete';
    let armed = false;
    kill.onmousedown = (e) => e.preventDefault();
    kill.onclick = (e) => {
      e.preventDefault();
      if (!armed) { armed = true; kill.textContent = 'delete cue?'; kill.classList.add('armed'); return; }
      close(false);
      ws.send(JSON.stringify({ type: 'delete_cue', sheet: c.sheet, id: c.id }));
    };
    ctl.append(bText, bVis, ...catBtns, bTrig, bWhole, bClear);

    const hint = document.createElement('div');
    hint.className = 'hintline';
    const keys = document.createElement('div');
    keys.className = 'hintline';
    keys.textContent = 'enter saves · esc cancels · select in the script to set a trigger';

    const repaint = () => {
      bText.classList.toggle('on', trigger === 'text');
      bVis.classList.toggle('on', trigger === 'visual');
      catBtns.forEach((b, n) => {
        const on = colour === cueCats[n].key;
        b.classList.toggle('on', on);
        // The button wears the category's own colour when chosen, so the vocabulary
        // is legible without a legend somewhere else.
        b.style.borderColor = on ? cueCats[n].swatch : '';
        b.style.color = on ? cueCats[n].swatch : '';
      });
      bTrig.classList.toggle('on', !!triggerText);
      if (!hint.textContent) {
        hint.textContent = triggerText ? `on “${triggerText}”` : 'fires on the whole line';
      }
      bClear.classList.toggle('on', !triggerText);
      bMe.classList.toggle('on', firedBy === 'operator');
      bAuto.classList.toggle('on', firedBy === 'auto');
      // Only meaningful for a machine-fired cue, so only shown for one.
      viaField.style.display = firedBy === 'auto' ? '' : 'none';
    };
    // Two rows: what the cue *is* on the first, what to do with it on the second.
    // Six controls wrapping in one row put `delete` in a different place depending on
    // the width of the card, which is not where a destructive button belongs.
    // Who actually presses it. The default is a person; the exception is worth one
    // control, because a cue that fires itself and a cue waiting to be pressed look
    // identical on a rail and are opposite responsibilities.
    const who = document.createElement('div');
    who.className = 'ctl';
    const bMe = mk('I press it', 'never', () => { firedBy = 'operator'; });
    const bAuto = mk('a machine fires it', 'never', () => { firedBy = 'auto'; });
    const viaField = document.createElement('input');
    viaField.placeholder = 'how — e.g. OSC from QLab';
    viaField.value = via;
    viaField.oninput = () => { via = viaField.value; };
    who.append(bMe, bAuto);

    const actions = document.createElement('div');
    actions.className = 'ctl actions';
    const bAdd = document.createElement('button');
    bAdd.textContent = 'add cue here';
    bAdd.onmousedown = (e) => e.preventDefault();
    bAdd.onclick = (e) => {
      e.preventDefault();
      pendingCueFor = lines[c.lineIndex].id;
      close(true);
      ws.send(JSON.stringify({
        type: 'insert_cue', sheet: c.sheet, lineId: lines[c.lineIndex].id,
      }));
    };
    actions.append(bAdd, kill);
    el.append(what, ctl, who, viaField, actions, hint, keys);
    repaint();
    fit();
    what.focus();

    // Unfold upwards when there is no room below.
    //
    // A cue waiting at the foot of the rail — its line not yet in sight — becomes an
    // editor several times its own height, and the buttons end up below the window.
    // Scrolling the rail to reach them is not an option either: the cards are frozen
    // while editing precisely so they do not move under the operator's hands. So the
    // card rises far enough to fit, which is the one direction with space in it.
    requestAnimationFrame(() => {
      if (cueEditing !== k) return;
      const railBox = $rail.getBoundingClientRect();
      const box = el.getBoundingClientRect();
      const top = box.top - railBox.top;
      const over = top + box.height - railBox.height;
      if (over > 0) el.style.transform = `translateY(${Math.max(0, top - over - 6).toFixed(1)}px)`;
    });

    let closed = false;
    function close(commit) {
      if (closed) return;
      closed = true;
      document.removeEventListener('keydown', onKey, true);
      document.removeEventListener('mousedown', onDown, true);
      openCue = null;
      cueEditing = -1;
      el.classList.remove('editing');
      if (commit) {
        ws.send(JSON.stringify({
          type: 'edit_cue', sheet: c.sheet, id: c.id, cue: what.value.trim(),
          trigger, colour, triggerText, triggerNth, firedBy, via,
          lineId: lines[moveTo].id,
        }));
      }
      el.innerHTML = before;
      // The card is its old size again, but only after the browser has laid it out —
      // measuring now would cache the editor's height and misplace everything below.
      requestAnimationFrame(() => { lineTops = null; layoutCues(); });
    }
    openCue = () => close(true);

    // On the document, not on the textarea.
    //
    // Enter and Escape have to work wherever the operator happens to be — after
    // pressing "use selection" the caret is in the script, and after any of the
    // toggles it is nowhere in particular. Binding them to the field meant the only
    // way to confirm was to click back into the text box first and then press enter,
    // which is a step with no purpose. Same keys as the script editor: enter saves,
    // escape cancels.
    function onKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); close(true); }
      else if (e.key === 'Escape') { e.preventDefault(); close(false); }
    }
    // Clicking away saves, as it does in the script editor — except inside the script
    // itself, which is not "away": pointing at the words is how a trigger is chosen,
    // and committing on it would make "use selection" unreachable.
    function onDown(e) {
      if (el.contains(e.target) || $lines.contains(e.target)) return;
      close(true);
    }
    document.addEventListener('keydown', onKey, true);
    document.addEventListener('mousedown', onDown, true);
  }

  $rail.addEventListener('click', (ev) => {
    if (document.body.dataset.prep !== 'on') return;
    const card = ev.target.closest('.cue');
    if (!card || card.classList.contains('editing')) return;
    const k = cueEls.indexOf(card);
    if (k >= 0) editCue(k);
  });

  // ---- flags ----------------------------------------------------------------
  //
  // A bookmark, and the one correction that has to work *during* a show: the moment
  // you notice a line is wrong is exactly the moment you cannot stop and retype it.
  // So flagging is one tap on the current line, or alt-click on any line, and it
  // never opens the editor or disturbs the scroll.
  // Where the reader is, as opposed to where the show is. Null until they navigate,
