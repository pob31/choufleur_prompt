<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choufleur — live</title>
<style>
  /*
    Dark by default and not theme-aware: this is read in a booth, at night, next to
    a lit desk. A light theme here would be a light source pointed at the operator.
  */
  :root {
    --bg: #0e0f12;
    --fg: #e8e6e3;
    --dim: #6a6f78;
    --dimmer: #43474e;
    --edge: #1b1d22;
    --now: #ffd479;      /* the current line: warm, like a work light */
    --lost: #ff6b5e;
    --speaker: #7fb2d9;
    --band: rgba(255, 212, 121, 0.06);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 400 clamp(15px, 2.1vh, 22px)/1.55 ui-serif, Georgia, "Iowan Old Style", serif;
    overflow: hidden;
  }

  /* The window the eye lives in. The centre band is where the current line sits —
     the operator's own rule: the last spoken line in the middle of what is visible. */
  /* A column, so the transcript takes its own space instead of lying on top of the
     script. Overlapping cost twice: the words underneath were unreadable, and a panel
     with pointer-events disabled cannot be selected, so nothing in it could be
     copied out. */
  #stage { display: flex; flex-direction: column; height: 100%; position: relative; }
  /* `overflow: hidden` and a stacking context, both load-bearing. #scroller is
     absolutely positioned, so it paints in the positioned layer and drew straight over
     the transcript below it however the boxes were sized — document order does not
     decide painting when one sibling is positioned and the other is not. Clipping the
     box and giving the panels a higher z-index settles it from both directions. */
  #view { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; z-index: 0; }
  /* Centred on the script box, not on the window: the reading line has to sit in the
     middle of what is actually visible. */
  #band {
    position: absolute; left: 0; right: 0; top: 50%; height: 2.6em;
    transform: translateY(-50%);
    background: var(--band);
    border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge);
    pointer-events: none; z-index: 1;
  }
  #scroller {
    position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
    scrollbar-width: none; padding: 50vh 6vw;
  }
  #scroller::-webkit-scrollbar { display: none; }

  .line { margin: 0 0 .85em 0; max-width: 46em; transition: color .25s, opacity .25s; }
  .who {
    display: block; font: 600 .68em/1.4 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .09em; text-transform: uppercase; color: var(--speaker);
    opacity: .75; margin-bottom: .15em;
  }
  .scene {
    margin: 2.2em 0 1.2em; padding-top: .8em; border-top: 1px solid var(--edge);
    font: 600 .7em/1.4 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .16em; text-transform: uppercase; color: var(--dimmer);
  }

  /* Lines already spoken recede; lines to come are legible but quiet; the current
     line is the only thing that is bright. Reading position should be findable
     without hunting for it. */
  .line { color: var(--dim); cursor: pointer; }
  .past { color: var(--dimmer); }
  .line.now { color: var(--now); }
  .line:hover { color: var(--fg); }

  /* Cut, but still printed. The operator has to see that the text is there and is
     not going to be said — a page silently missing lines is how you lose your
     place, and a line cut this week may be back next week. */
  .line.cut { text-decoration: line-through; opacity: .38; }
  .line.cut .who { text-decoration: none; }

  /* A correction, briefly acknowledged, so a tap that did nothing is obvious. */
  @keyframes placed { from { background: rgba(255,212,121,.28); } to { background: none; } }
  .line.placed { animation: placed .9s ease-out; }

  /* Confidence is weight, never a number: a percentage would be a claim about
     calibration that has not been measured. */
  body[data-conf="word"] .line.now,
  body[data-conf="line"] .line.now { opacity: 1; }
  body[data-conf="block"] .line.now { opacity: .72; }
  body[data-conf="scene"] .line.now { opacity: .5; font-style: italic; }
  body[data-conf="lost"] .line.now { color: var(--dim); opacity: .4; }
  body[data-conf="lost"] #band { background: none; }

  /* Lost is loud on purpose. The measured error distribution is bimodal — on the
     line, or off by tens to hundreds — so the failure to design for is not "slightly
     wrong", it is "confidently elsewhere". This is the GPS saying "recalculating". */
  #hint {
    position: absolute; z-index: 3; left: 50%; bottom: 2.6em; transform: translateX(-50%);
    padding: .35em .9em; border-radius: 999px;
    background: rgba(255,212,121,.12); color: var(--now);
    font: 400 .66em/1.4 ui-sans-serif, system-ui, sans-serif; letter-spacing: .04em;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  body[data-conf="lost"] #hint { opacity: 1; }

  /* What the recogniser heard. Small, out of the way, and readable when you look —
     on a bad channel the transcript is visibly nonsense, which is the fastest way to
     tell "the tracker is broken" apart from "the microphone is". */
  /* A fixed band, not a panel that grows: if it sizes to its contents it is a
     sliver at the start of a run and a different layout ten minutes later, and the
     script box resizes under the reader every time a line arrives. */
  #heard {
    position: relative; z-index: 4;
    flex: 0 0 9em; height: 9em; overflow-y: auto;
    padding: .5em 1.1em .6em; background: #000;
    border-top: 1px solid var(--edge);
    font: 400 .66em/1.5 ui-mono, ui-monospace, SFMono-Regular, Menlo, monospace;
    user-select: text; -webkit-user-select: text; cursor: text;
  }
  #heard .head {
    display: flex; align-items: center; gap: .8em; position: sticky; top: -.5em;
    background: #000; padding: .1em 0 .3em; color: var(--dimmer);
    letter-spacing: .09em; text-transform: uppercase; font-size: .84em;
  }
  #heard .head button {
    margin-left: auto; border: 1px solid var(--dimmer); background: none;
    color: var(--dim); border-radius: 999px; padding: .15em .7em; font: inherit;
    cursor: pointer; text-transform: none; letter-spacing: .03em;
  }
  #heard p { margin: .12em 0; color: var(--dimmer); transition: color .3s; }
  #heard p.hit { color: var(--speaker); }
  #heard p.junk { color: var(--lost); opacity: .75; }
  #heard p.tail { color: var(--dim); }
  #heard p.interim { font-style: italic; opacity: .7; }
  body[data-heard="off"] #heard { display: none; }
  #heard p:last-child { margin-bottom: .4em; }

  #lost {
    position: absolute; z-index: 3; left: 0; right: 0; top: 0;
    padding: .6em 1em; text-align: center;
    background: var(--lost); color: #1a0d0b;
    font: 600 .8em/1.3 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .06em; text-transform: uppercase;
    transform: translateY(-100%); transition: transform .2s ease;
  }
  body[data-conf="lost"] #lost { transform: none; }

  footer {
    position: relative; flex: 0 0 auto; z-index: 5;
    display: flex; gap: 1.4em; align-items: center;
    padding: .55em 1.1em; background: rgba(14,15,18,.92);
    border-top: 1px solid var(--edge);
    font: 400 .68em/1.4 ui-sans-serif, system-ui, sans-serif;
    color: var(--dim); letter-spacing: .04em;
  }
  footer b { color: var(--fg); font-weight: 600; }
  #follow {
    margin-left: auto; border: 1px solid var(--dimmer); background: none;
    color: var(--dim); border-radius: 999px; padding: .3em .9em;
    font: inherit; cursor: pointer;
  }
  #follow[hidden] { display: none; }
  /* Edit mode. Deliberately a mode rather than always-on: a click means "we are
     here", which is the control that matters during a run, and a stray click that
     silently rewrote the script would be much worse than one that moved the position. */
  body[data-edit="on"] .line { cursor: text; }
  body[data-edit="on"] .line.now { outline: none; }
  /* Two fields, because a line is two things. Editing them as one blob meant the
     speaker chip was swallowed into the text and had to be retyped — and an
     attribution wrongly imported as dialogue, which is the commonest importer
     mistake, is precisely a case where the speaker is the part that needs fixing. */
  .editor { display: block; margin: 0 0 .85em 0; max-width: 46em; }
  .editor input {
    display: block; width: 100%; background: #16181d; color: var(--fg);
    border: 1px solid var(--dimmer); border-radius: 4px; padding: .35em .5em;
    font: inherit;
  }
  .editor input.who-field {
    font: 600 .68em/1.4 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .09em; text-transform: uppercase; color: var(--speaker);
    margin-bottom: .3em; border-color: var(--edge);
  }
  .editor input:focus { outline: none; border-color: var(--now); }
  .editor .row { display: flex; gap: .5em; align-items: center; margin-top: .35em; }
  .editor button {
    border: 1px solid var(--dimmer); background: none; color: var(--dim);
    border-radius: 999px; padding: .25em .8em; cursor: pointer;
    font: 400 .62em/1.4 ui-sans-serif, system-ui, sans-serif; letter-spacing: .05em;
  }
  .editor button.struck { border-color: var(--lost); color: var(--lost); }
  .editor input.gone { text-decoration: line-through; opacity: .45; }
  .editor .keys {
    font: 400 .6em/1.5 ui-sans-serif, system-ui, sans-serif;
    color: var(--dimmer); margin-top: .25em; letter-spacing: .05em;
  }
  body[data-edit="on"] #editing { opacity: 1; }
  #editing {
    position: absolute; z-index: 3; left: 50%; top: .6em; transform: translateX(-50%);
    padding: .3em .9em; border-radius: 999px; background: var(--now); color: #1a0d0b;
    font: 600 .64em/1.4 ui-sans-serif, system-ui, sans-serif; letter-spacing: .05em;
    text-transform: uppercase; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #edit.on { border-color: var(--now); color: var(--now); }

  #edit {
    margin-left: auto; border: 1px solid var(--dimmer); background: none;
    color: var(--dim); border-radius: 999px; padding: .3em .9em; font: inherit;
    cursor: pointer;
  }
  #ear {
    margin-left: .6em; border: 1px solid var(--dimmer); background: none;
    color: var(--dim); border-radius: 999px; padding: .3em .9em; font: inherit;
    cursor: pointer;
  }
  #follow { margin-left: .6em; }
  #dot { width: .5em; height: .5em; border-radius: 50%; background: var(--dimmer); }
  body[data-running="true"] #dot { background: #5fbf7f; }
</style>
</head>
<body data-conf="scene" data-running="true">
<div id="stage">
  <div id="lost">position lost — waiting to recognise the text</div>
  <div id="view">
    <div id="band"></div>
    <div id="hint">tap the line being spoken to put it back on track</div>
    <div id="scroller"><div id="lines"></div></div>
  </div>
  <div id="heard"><div class="head">heard<button id="copy">copy</button></div><div id="heardlog"></div></div>
  <div id="editing">editing — click a line to correct it</div>
  <footer>
    <span id="dot"></span>
    <span id="where">—</span>
    <span id="conf">—</span>
    <span id="clock">0:00</span>
    <button id="edit">edit</button>
    <button id="ear">heard</button>
    <button id="follow" hidden>follow</button>
  </footer>
</div>
<script>
(() => {
  const $lines = document.getElementById('lines');
  const $scroller = document.getElementById('scroller');
  const $where = document.getElementById('where');
  const $conf = document.getElementById('conf');
  const $clock = document.getElementById('clock');
  const $follow = document.getElementById('follow');

  let lines = [];
  let els = [];
  let current = -1;
  let following = true;
  // Programmatic scrolling fires the same events as a finger, so follow is only
  // dropped when the scroll was not one we asked for.
  let selfScrolling = 0;

  const fmt = (s) => {
    s = Math.max(0, Math.round(s));
    const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(ss).padStart(2, '0');
  };

  async function loadScript() {
    lines = await (await fetch('script.json')).json();
    const frag = document.createDocumentFragment();
    let scene = null;
    lines.forEach((l, i) => {
      if (l.scene !== scene) {
        scene = l.scene;
        const h = document.createElement('div');
        h.className = 'scene';
        h.textContent = scene.replace(/^sc-/, 'scene ');
        frag.appendChild(h);
      }
      const p = document.createElement('p');
      p.className = 'line' + (l.cut ? ' cut' : '');
      p.dataset.i = i;
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = (l.character || '').replace(/^char-/, '').replace(/-/g, ' ');
      p.appendChild(who);
      p.appendChild(document.createTextNode(l.text));
      frag.appendChild(p);
      els[i] = p;
    });
    $lines.appendChild(frag);
  }

  function show(index, conf) {
    if (index < 0 || index >= els.length) return;
    if (!els[index] || !els[index].isConnected) {
      // The current line is the one being edited: it is out of the document, so
      // measuring or scrolling to it would read zeros and throw the page to the top.
      document.body.dataset.conf = conf;
      $conf.textContent = conf;
      return;
    }
    document.body.dataset.conf = conf;
    $conf.textContent = conf;
    $where.innerHTML = '<b>' + (lines[index]?.id ?? '') + '</b> of ' + lines.length;

    if (index !== current) {
      if (current >= 0) els[current].classList.remove('now');
      // Everything behind the position recedes; walking the delta keeps this O(moved)
      // rather than O(script) on every update.
      const [from, to] = index > current ? [current + 1, index] : [index, current];
      for (let i = Math.max(0, from); i <= to && i < els.length; i++) {
        els[i].classList.toggle('past', i < index);
      }
      els[index].classList.add('now');
      current = index;
    }
    // An open editor freezes the scroll. The show carries on advancing underneath —
    // the position is still live and the footer still moves — but yanking the page
    // out from under somebody mid-correction loses the correction, which is exactly
    // what happened the first time this was used during a run.
    if (!following || openEditor) return;

    // Ease a step, cut a relocation. Gliding across three hundred lines would both
    // look absurd and disguise the fact that something significant just happened.
    const el = els[index];
    const target = el.offsetTop + el.offsetHeight / 2 - $scroller.clientHeight / 2;
    const jump = Math.abs(target - $scroller.scrollTop) > $scroller.clientHeight * 1.2;
    selfScrolling++;
    $scroller.scrollTo({ top: target, behavior: jump ? 'auto' : 'smooth' });
    setTimeout(() => { selfScrolling = Math.max(0, selfScrolling - 1); }, jump ? 60 : 700);
  }

  $scroller.addEventListener('scroll', () => {
    if (selfScrolling > 0) return;
    if (following) { following = false; $follow.hidden = false; }
  }, { passive: true });

  $follow.addEventListener('click', () => {
    following = true;
    $follow.hidden = true;
    if (current >= 0) show(current, document.body.dataset.conf);
  });

  // Click a line to say "we are here". The tracker is forward-only and, when it is
  // wrong, is usually wrong by a lot — so the fastest route back is the person who
  // can see the page. The GPS does not argue with the driver.
  let ws = null;
  let editing = false;
  const $edit = document.getElementById('edit');
  $edit.addEventListener('click', () => {
    editing = !editing;
    document.body.dataset.edit = editing ? 'on' : 'off';
    $edit.classList.toggle('on', editing);
  });

  let openEditor = null;
  function beginEdit(el) {
    if (openEditor) openEditor(false);
    const i = Number(el.dataset.i);
    const wasWho = lines[i].character || '';
    const wasText = lines[i].text;

    const box = document.createElement('div');
    box.className = 'editor';
    const who = document.createElement('input');
    who.className = 'who-field';
    who.value = wasWho.replace(/^char-/, '').replace(/-/g, ' ');
    const txt = document.createElement('input');
    txt.value = wasText;
    // Cut, not delete. The line stays in the script and stays on the page, struck
    // through, because a cut is a decision about tonight and not about the play — and
    // one that gets reversed often enough that losing the text would be worse than
    // showing text nobody says.
    let cut = !!lines[i].cut;
    const strike = document.createElement('button');
    const paint = () => {
      strike.textContent = cut ? 'cut — click to restore' : 'cut this line';
      strike.classList.toggle('struck', cut);
      txt.classList.toggle('gone', cut);
    };
    strike.onclick = (e) => { e.preventDefault(); cut = !cut; paint(); txt.focus(); };
    paint();
    const row = document.createElement('div');
    row.className = 'row';
    row.appendChild(strike);
    const keys = document.createElement('div');
    keys.className = 'keys';
    keys.textContent = 'enter to save · esc to cancel · tab between fields';
    box.append(who, txt, row, keys);
    el.replaceWith(box);

    const done = (commit) => {
      openEditor = null;
      const newText = txt.value.trim();
      const newWho = who.value.trim();
      if (commit && newText) {
        const character = newWho
          ? 'char-' + newWho.toLowerCase().replace(/\s+/g, '-')
          : wasWho;
        if (newText !== wasText || character !== wasWho || cut !== !!lines[i].cut) {
          ws.send(JSON.stringify({
            type: 'edit_line', lineIndex: i, text: newText, character, cut,
          }));
          lines[i].text = newText;
          lines[i].character = character;
          lines[i].cut = cut;
        }
      }
      box.replaceWith(el);
      render(i);
    };
    openEditor = done;
    txt.onkeydown = who.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); done(true); }
      if (e.key === 'Escape') { e.preventDefault(); done(false); }
    };
    // Committing on blur would fire when tabbing between the two fields, so the
    // editor closes only on an explicit key or a click elsewhere.
    box.addEventListener('focusout', (e) => {
      if (!box.contains(e.relatedTarget)) done(true);
    });
    txt.focus();
    txt.setSelectionRange(txt.value.length, txt.value.length);
  }

  function render(i) {
    const el = els[i], l = lines[i];
    if (!el) return;
    el.classList.toggle('cut', !!l.cut);
    el.textContent = '';
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = (l.character || '').replace(/^char-/, '').replace(/-/g, ' ');
    el.appendChild(who);
    el.appendChild(document.createTextNode(l.text));
  }

  $lines.addEventListener('click', (ev) => {
    const el = ev.target.closest('.line');
    if (!el || !ws || ws.readyState !== 1) return;
    if (editing) { beginEdit(el); return; }
    const i = Number(el.dataset.i);
    ws.send(JSON.stringify({ type: 'position_jump', lineIndex: i }));
    el.classList.remove('placed');
    void el.offsetWidth;
    el.classList.add('placed');
    following = true;
    $follow.hidden = true;
  });

  // A short rolling window of what the recogniser produced. Long enough to see a
  // pattern, short enough not to become something to read instead of the script.
  const $heard = document.getElementById('heardlog');
  const heardBox = document.getElementById('heard');
  const heardLog = [];
  // Follow the tail by default, and keep following unless the reader deliberately
  // scrolls back. Measuring the distance at append time instead was wrong in the way
  // that matters: once the backlog grew past the threshold once, the panel stopped
  // following and never resumed, so a run left alone quietly froze near the top.
  //
  // The flag is recomputed on every scroll, including the programmatic one, so
  // scrolling back to the bottom re-arms it without a separate control.
  let heardStuck = true;
  heardBox.addEventListener('scroll', () => {
    heardStuck =
      heardBox.scrollHeight - heardBox.scrollTop - heardBox.clientHeight < 24;
  }, { passive: true });
  function heard(m) {
    if (m.interim) return;               // partials churn; show settled text only
    heardLog.push(m);
    // A longer tail now that it has its own space and can be scrolled and copied.
    while (heardLog.length > 60) heardLog.shift();
    $heard.innerHTML = '';
    heardLog.forEach((h, i) => {
      const p = document.createElement('p');
      p.className =
        (h.filtered ? 'junk ' : h.matched ? 'hit ' : '') +
        (i === heardLog.length - 1 ? 'tail' : '');
      const t = Math.round(h.tAudio);
      const clock = Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
      const mark = h.filtered ? '  \u2717  ' : h.matched ? '  \u2713  ' : '  \u00b7  ';
      p.textContent = clock + mark + h.text;
      if (h.filtered) p.title = 'discarded by the hallucination filter: ' + h.filtered;
      $heard.appendChild(p);
    });
    if (heardStuck) heardBox.scrollTop = heardBox.scrollHeight;
  }
  document.getElementById('copy').addEventListener('click', async (e) => {
    e.stopPropagation();
    const text = heardLog
      .map((h) => {
        const t = Math.round(h.tAudio);
        const state = h.filtered ? h.filtered : h.matched ? 'matched' : '';
        return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0') +
          '\t' + state + '\t' + h.text;
      })
      .join('\n');
    try {
      await navigator.clipboard.writeText(text);
      const b = e.target; const was = b.textContent;
      b.textContent = 'copied'; setTimeout(() => { b.textContent = was; }, 1200);
    } catch { /* selection still works; the button is the convenience */ }
  });
  document.getElementById('ear').addEventListener('click', () => {
    document.body.dataset.heard = document.body.dataset.heard === 'off' ? 'on' : 'off';
  });

  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.type === 'hello') {
        if (m.title) document.title = m.title + ' — live';
        if (m.position) { show(m.position.lineIndex, m.position.confidence); $clock.textContent = fmt(m.position.tAudio); }
      } else if (m.type === 'position_update') {
        show(m.lineIndex, m.confidence);
        $clock.textContent = fmt(m.tAudio);
      } else if (m.type === 'line_edited') {
        lines[m.lineIndex].text = m.text;
        if (m.character) lines[m.lineIndex].character = m.character;
        lines[m.lineIndex].cut = m.cut;
        render(m.lineIndex);
      } else if (m.type === 'heard') {
        heard(m);
      } else if (m.type === 'run_state') {
        document.body.dataset.running = String(m.running);
        $clock.textContent = fmt(m.tAudio);
      }
    };
    // The run outlives any one connection; reconnecting resyncs through `hello`.
    ws.onclose = () => setTimeout(connect, 1000);
  }

  loadScript().then(connect);
})();
</script>
</body>
</html>
